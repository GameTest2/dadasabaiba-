<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ダダサバイバー・クローン</title>
    <style>
        body { margin: 0; overflow: hidden; background: #222; font-family: 'Arial Black', sans-serif; user-select: none; }
        canvas { display: block; background: #5a8a3d; margin: 0 auto; }
        
        /* 経験値バー (本家風上部バー) */
        #exp-container { 
            position: absolute; top: 0; left: 0; width: 100%; height: 25px; 
            background: rgba(0,0,0,0.5); border-bottom: 3px solid #000; z-index: 10;
        }
        #exp-bar-fill { width: 0%; height: 100%; background: #3498db; transition: width 0.3s; }
        #level-badge { 
            position: absolute; top: 2px; right: 10px; color: white; font-size: 14px; font-weight: bold;
        }

        #stats { position: absolute; top: 35px; left: 15px; color: white; text-shadow: 2px 2px #000; font-size: 18px; }

        /* スキル選択画面 */
        #skill-menu { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: linear-gradient(180deg, #444, #111); padding: 30px; border-radius: 20px;
            display: none; text-align: center; border: 4px solid #f1c40f; z-index: 100; min-width: 300px;
        }
        .skill-option {
            background: #fff; color: #333; padding: 20px; margin: 15px 0; border-radius: 12px;
            cursor: pointer; border-bottom: 6px solid #bdc3c7; font-weight: bold; font-size: 20px; transition: 0.1s;
        }
        .skill-option:active { transform: translateY(4px); border-bottom-width: 2px; }
        h2 { color: #f1c40f; margin-bottom: 20px; font-size: 28px; }
    </style>
</head>
<body>

<div id="exp-container"><div id="exp-bar-fill"></div><div id="level-badge">Lv.1</div></div>
<div id="stats">KILLS: 0</div>

<div id="skill-menu">
    <h2>SKILL UP!</h2>
    <div id="options-container"></div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const expFill = document.getElementById('exp-bar-fill');
const levelBadge = document.getElementById('level-badge');
const statsEl = document.getElementById('stats');
const skillMenu = document.getElementById('skill-menu');
const optionsContainer = document.getElementById('options-container');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let isPaused = false;
let score = 0;
let level = 1;
const MAX_ENEMIES = 100; // 同時出現上限

const player = {
    x: canvas.width/2, y: canvas.height/2, size: 22, speed: 4,
    hp: 100, maxHp: 100, exp: 0, nextExp: 10,
    bulletCount: 3, fireRate: 700, lastFire: 0, power: 1
};

let enemies = [];
let bullets = [];
let gems = [];
const keys = {};

window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

// 描画ヘルパー
function drawEntity(x, y, size, color, type = 'box') {
    ctx.fillStyle = color;
    if(type === 'circle') {
        ctx.beginPath(); ctx.arc(x, y, size, 0, Math.PI*2); ctx.fill();
    } else {
        ctx.fillRect(x - size/2, y - size/2, size, size);
    }
}

function spawnEnemy(isBoss = false) {
    if (enemies.length >= MAX_ENEMIES && !isBoss) return;
    const side = Math.floor(Math.random() * 4);
    let x, y;
    if (side === 0) { x = Math.random() * canvas.width; y = -50; }
    else if (side === 1) { x = Math.random() * canvas.width; y = canvas.height + 50; }
    else if (side === 2) { x = -50; y = Math.random() * canvas.height; }
    else { x = canvas.width + 50; y = Math.random() * canvas.height; }
    
    enemies.push({
        x, y, 
        size: isBoss ? 50 : 20, 
        hp: isBoss ? 50 + (level * 20) : 2 + Math.floor(level/2), 
        speed: isBoss ? 2 : 1.5 + (level * 0.1),
        isBoss,
        color: isBoss ? '#c0392b' : '#2c3e50'
    });
}

function fire() {
    const now = Date.now();
    if (now - player.lastFire < player.fireRate || enemies.length === 0) return;

    let target = enemies[0];
    let minDist = Infinity;
    enemies.forEach(e => {
        const d = Math.hypot(e.x - player.x, e.y - player.y);
        if (d < minDist) { minDist = d; target = e; }
    });

    const baseAngle = Math.atan2(target.y - player.y, target.x - player.x);
    for (let i = 0; i < player.bulletCount; i++) {
        const angle = baseAngle + (i - (player.bulletCount - 1) / 2) * 0.2;
        bullets.push({ x: player.x, y: player.y, vx: Math.cos(angle) * 12, vy: Math.sin(angle) * 12 });
    }
    player.lastFire = now;
}

const skillList = [
    { name: "🔥 弾数 +1", act: () => player.bulletCount++ },
    { name: "⚡ 攻撃速度 UP", act: () => player.fireRate *= 0.8 },
    { name: "👟 移動速度 UP", act: () => player.speed += 0.6 },
    { name: "❤️ 体力全回復", act: () => player.hp = player.maxHp },
    { name: "💪 攻撃力 UP", act: () => player.power += 1.5 }
];

function levelUp() {
    isPaused = true;
    skillMenu.style.display = 'block';
    optionsContainer.innerHTML = '';
    const shuffled = [...skillList].sort(() => 0.5 - Math.random()).slice(0, 3);
    shuffled.forEach(s => {
        const div = document.createElement('div');
        div.className = 'skill-option';
        div.innerText = s.name;
        div.onclick = () => {
            s.act();
            isPaused = false;
            skillMenu.style.display = 'none';
        };
        optionsContainer.appendChild(div);
    });
}

function update() {
    if (isPaused) return;

    // 移動
    if (keys['ArrowUp'] || keys['KeyW']) player.y -= player.speed;
    if (keys['ArrowDown'] || keys['KeyS']) player.y += player.speed;
    if (keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed;
    if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed;

    fire();

    // 弾更新
    bullets.forEach((b, i) => {
        b.x += b.vx; b.y += b.vy;
        if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) bullets.splice(i, 1);
    });

    // 敵更新
    enemies.forEach((e, i) => {
        const angle = Math.atan2(player.y - e.y, player.x - e.x);
        e.x += Math.cos(angle) * e.speed;
        e.y += Math.sin(angle) * e.speed;

        if (Math.hypot(e.x - player.x, e.y - player.y) < player.size) {
            player.hp -= 0.3;
            if (player.hp <= 0) location.reload();
        }

        bullets.forEach((b, bi) => {
            if (Math.hypot(e.x - b.x, e.y - b.y) < e.size) {
                e.hp -= player.power;
                bullets.splice(bi, 1);
                if (e.hp <= 0) {
                    gems.push({ x: e.x, y: e.y }); // 経験値ドロップ
                    enemies.splice(i, 1);
                    score++;
                    statsEl.innerText = `KILLS: ${score}`;
                    if (score % 20 === 0) spawnEnemy(true); // 20キル毎に中ボス
                }
            }
        });
    });

    // ジェム回収
    gems.forEach((g, i) => {
        const d = Math.hypot(g.x - player.x, g.y - player.y);
        if (d < 100) { // 磁石範囲
            g.x += (player.x - g.x) * 0.1;
            g.y += (player.y - g.y) * 0.1;
        }
        if (d < 20) {
            gems.splice(i, 1);
            player.exp++;
            if (player.exp >= player.nextExp) {
                level++;
                player.exp = 0;
                player.nextExp += 8;
                levelBadge.innerText = `Lv.${level}`;
                levelUp();
            }
            expFill.style.width = `${(player.exp / player.nextExp) * 100}%`;
        }
    });

    if (Math.random() < 0.05) spawnEnemy();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // 背景グリッド
    ctx.strokeStyle = "rgba(0,0,0,0.1)";
    for(let i=0; i<canvas.width; i+=60){ ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
    for(let j=0; j<canvas.height; j+=60){ ctx.beginPath(); ctx.moveTo(0,j); ctx.lineTo(canvas.width,j); ctx.stroke(); }

    gems.forEach(g => drawEntity(g.x, g.y, 8, '#2ecc71', 'circle'));
    bullets.forEach(b => drawEntity(b.x, b.y, 6, '#f1c40f', 'circle'));
    enemies.forEach(e => drawEntity(e.x, e.y, e.size, e.color));
    
    // プレイヤー描画
    drawEntity(player.x, player.y, player.size, '#3498db');
    // プレイヤーHPバー
    ctx.fillStyle = '#eee'; ctx.fillRect(player.x - 20, player.y + 25, 40, 5);
    ctx.fillStyle = '#e74c3c'; ctx.fillRect(player.x - 20, player.y + 25, (player.hp/player.maxHp)*40, 5);

    requestAnimationFrame(() => { update(); draw(); });
}

draw();
</script>
</body>
</html>
