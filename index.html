<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ダダサバイバー・究極進化</title>
    <style>
        body { margin: 0; overflow: hidden; background: #222; font-family: 'Arial Black', sans-serif; }
        canvas { display: block; background: #4e7a3a; }
        
        /* UIレイアウト */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; pointer-events: none; }
        #exp-bar-container { width: 100%; height: 20px; background: #333; border-bottom: 2px solid #000; }
        #exp-bar-fill { width: 0%; height: 100%; background: #3498db; transition: width 0.2s; }
        #top-info { color: white; padding: 10px; text-shadow: 2px 2px #000; font-size: 18px; display: flex; justify-content: space-between; }

        /* セレクター画面 */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100; pointer-events: auto;
        }
        .card-container { display: flex; gap: 20px; }
        .card {
            background: #fff; border-radius: 15px; padding: 20px; width: 180px;
            text-align: center; cursor: pointer; border-bottom: 8px solid #999;
            transition: 0.1s; pointer-events: auto;
        }
        .card:hover { transform: scale(1.05); }
        .card:active { transform: translateY(5px); border-bottom-width: 2px; }
        .card.weapon { background: #f1c40f; }
        .card.skill { background: #ecf0f1; }
        h2 { color: #f1c40f; font-size: 32px; margin-bottom: 30px; text-shadow: 3px 3px #000; }
    </style>
</head>
<body>

<div id="ui-layer">
    <div id="exp-bar-container"><div id="exp-bar-fill"></div></div>
    <div id="top-info">
        <div id="level-txt">Lv.1</div>
        <div id="kill-txt">KILLS: 0</div>
    </div>
</div>

<!-- 初期武器選択 -->
<div id="start-screen" class="overlay">
    <h2>武器を選択せよ</h2>
    <div class="card-container">
        <div class="card weapon" onclick="startGame('kunai')"><h3>クナイ</h3><p>自動追尾の弾</p></div>
        <div class="card weapon" onclick="startGame('shotgun')"><h3>ショットガン</h3><p>扇状の強力攻撃</p></div>
        <div class="card weapon" onclick="startGame('bat')"><h3>バット</h3><p>近接ノックバック</p></div>
    </div>
</div>

<!-- スキル選択 -->
<div id="skill-screen" class="overlay" style="display:none;">
    <h2>スキルアップ！</h2>
    <div id="skill-options" class="card-container"></div>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// --- ゲーム定数と変数 ---
let gameState = 'start'; 
let kills = 0;
let level = 1;
const player = { x:0, y:0, hp:100, maxHp:100, exp:0, nextExp:5, speed:4, size:20 };
const mySkills = { attack: {}, passive: {} };
let enemies = [], bullets = [], gems = [];
const keys = {};

// --- スキルデータ定義 ---
const SKILL_DATA = {
    attack: {
        kunai: { name: "クナイ", evoWith: "power", evoName: "幽霊手裏剣" },
        shotgun: { name: "ショットガン", evoWith: "area", evoName: "ガトリング" },
        bat: { name: "バット", evoWith: "hpMax", evoName: "ルシール" }
    },
    passive: {
        power: { name: "強力銃弾", desc: "攻撃UP" },
        hpMax: { name: "フィットネスガイド", desc: "HP上限UP" },
        area: { name: "高性能爆薬", desc: "範囲UP" }
    }
};

// --- ゲーム開始 ---
function startGame(weaponId) {
    document.getElementById('start-screen').style.display = 'none';
    player.x = canvas.width/2;
    player.y = canvas.height/2;
    mySkills.attack[weaponId] = 1; // 初期武器設定
    gameState = 'play';
}

// --- 当たり判定フリーズ対策: シンプルな距離判定 ---
function update() {
    if (gameState !== 'play') return;

    // プレイヤー移動
    if (keys['KeyW'] || keys['ArrowUp']) player.y -= player.speed;
    if (keys['KeyS'] || keys['ArrowDown']) player.y += player.speed;
    if (keys['KeyA'] || keys['ArrowLeft']) player.x -= player.speed;
    if (keys['KeyD'] || keys['ArrowRight']) player.x += player.speed;

    // 攻撃ロジック (クナイを例に)
    autoAttack();

    // 敵の更新（数が増えてもいいように軽量化）
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        const dist = Math.hypot(player.x - e.x, player.y - e.y);
        
        // プレイヤーへ追従
        e.x += (player.x - e.x) / dist * e.speed;
        e.y += (player.y - e.y) / dist * e.speed;

        // ダメージ判定
        if (dist < player.size + e.size) {
            player.hp -= 0.2;
            if (player.hp <= 0) location.reload();
        }

        // 弾との判定
        for (let j = bullets.length - 1; j >= 0; j--) {
            const b = bullets[j];
            if (Math.hypot(e.x - b.x, e.y - b.y) < e.size + 5) {
                e.hp -= 1;
                bullets.splice(j, 1);
                if (e.hp <= 0) {
                    gems.push({x: e.x, y: e.y});
                    enemies.splice(i, 1);
                    kills++;
                    document.getElementById('kill-txt').innerText = `KILLS: ${kills}`;
                }
                break;
            }
        }
    }

    // ジェム回収
    for (let i = gems.length - 1; i >= 0; i--) {
        const g = gems[i];
        const d = Math.hypot(player.x - g.x, player.y - g.y);
        if (d < 30) {
            gems.splice(i, 1);
            gainExp(1);
        } else if (d < 150) { // 磁石効果
            g.x += (player.x - g.x) * 0.1;
            g.y += (player.y - g.y) * 0.1;
        }
    }

    // 敵のスポーン（上限100体）
    if (enemies.length < 100 && Math.random() < 0.05) spawnEnemy();

    // 弾の移動
    bullets.forEach((b, i) => {
        b.x += b.vx; b.y += b.vy;
        if (Math.abs(b.x - player.x) > 1000) bullets.splice(i, 1);
    });
}

function gainExp(amt) {
    player.exp += amt;
    if (player.exp >= player.nextExp) {
        player.exp = 0;
        player.nextExp += 5;
        level++;
        document.getElementById('level-txt').innerText = `Lv.${level}`;
        showSkillSelect();
    }
    document.getElementById('exp-bar-fill').style.width = (player.exp / player.nextExp * 100) + "%";
}

function showSkillSelect() {
    gameState = 'pause';
    const menu = document.getElementById('skill-screen');
    const container = document.getElementById('skill-options');
    menu.style.display = 'flex';
    container.innerHTML = '';

    // 本来はランダムだが、ここではデモ用にパッシブを表示
    Object.keys(SKILL_DATA.passive).forEach(key => {
        const s = SKILL_DATA.passive[key];
        const card = document.createElement('div');
        card.className = 'card skill';
        card.innerHTML = `<h3>${s.name}</h3><p>${s.desc}</p>`;
        card.onclick = () => {
            mySkills.passive[key] = (mySkills.passive[key] || 0) + 1;
            menu.style.display = 'none';
            gameState = 'play';
        };
        container.appendChild(card);
    });
}

function spawnEnemy() {
    const angle = Math.random() * Math.PI * 2;
    enemies.push({
        x: player.x + Math.cos(angle) * canvas.width,
        y: player.y + Math.sin(angle) * canvas.height,
        size: 15, hp: 2 + Math.floor(level/3), speed: 2, color: '#333'
    });
}

let lastFire = 0;
function autoAttack() {
    const now = Date.now();
    if (now - lastFire < 800) return;
    
    // 武器ごとの挙動（簡易版）
    if (mySkills.attack.kunai) {
        const target = enemies[0];
        if (!target) return;
        const angle = Math.atan2(target.y - player.y, target.x - player.x);
        bullets.push({ x: player.x, y: player.y, vx: Math.cos(angle)*10, vy: Math.sin(angle)*10 });
    }
    lastFire = now;
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // ジェム
    ctx.fillStyle = '#2ecc71';
    gems.forEach(g => { ctx.beginPath(); ctx.arc(g.x, g.y, 5, 0, Math.PI*2); ctx.fill(); });

    // 敵
    ctx.fillStyle = '#c0392b';
    enemies.forEach(e => { ctx.fillRect(e.x-e.size/2, e.y-e.size/2, e.size, e.size); });

    // 弾
    ctx.fillStyle = '#f1c40f';
    bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI*2); ctx.fill(); });

    // プレイヤー
    ctx.fillStyle = '#3498db';
    ctx.fillRect(player.x-10, player.y-10, 20, 20);

    requestAnimationFrame(() => { update(); draw(); });
}

window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

draw();
</script>
</body>
</html>
