<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>ダダサバイバー：アルティメット完全版</title>
    <style>
        /* --- [1,2/6] CSS: レイアウト・全画面修正・デザイン --- */
        
        * { box-sizing: border-box; }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f1210;
            font-family: 'Arial Black', sans-serif;
        }

        /* 画面いっぱいに広げる設定 */
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #385732;
            display: block;
        }

        /* UIレイヤーを最前面に固定 */
        #ui-root {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        /* 経験値バー */
        #exp-header {
            width: 100%;
            height: 20px;
            background: #1a1a1a;
            border-bottom: 3px solid #000;
        }

        #exp-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(180deg, #00e5ff 0%, #00a8ff 100%);
            box-shadow: 0 0 15px rgba(0,229,255,0.6);
            transition: width 0.2s ease-out;
        }

        /* ステータス表記 */
        #stats-panel {
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            color: #fff;
            font-size: 24px;
            text-shadow: 3px 3px 0px #000;
        }

        #lv-badge { color: #f1c40f; font-weight: 900; }

        /* スロットUI */
        #inventory-panel {
            position: absolute;
            top: 70px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .slot {
            width: 50px;
            height: 50px;
            background: rgba(0,0,0,0.6);
            border: 2px solid #555;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .slot.has-item { border-color: #f1c40f; background: rgba(241,196,15,0.2); }

        /* スキル選択画面（中央配置） */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5000;
            pointer-events: auto;
        }

        .overlay.active { display: flex; }

        .card-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            width: 100%;
        }

        /* カードのデザイン（縦長に固定） */
        .card {
            width: 250px;
            height: 350px;
            background: linear-gradient(145deg, #f1c40f, #d4ac0d);
            border: 5px solid #2c3e50;
            border-radius: 20px;
            padding: 20px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 10px 0 #95a5a6;
        }

        .card.red { background: linear-gradient(145deg, #ff4757, #ff6b81); border-color: #fff; color: #fff; }
        .card.gold { background: linear-gradient(145deg, #fff200, #ff9f43); border-color: #fff; }
        
        .card-title { font-size: 24px; margin: 10px 0; }
        .card-desc { font-size: 14px; background: rgba(255,255,255,0.2); border-radius: 10px; padding: 10px; flex-grow: 1; }
        
        /* ゲームオーバー画面 */
        #gameover-panel {
            background: linear-gradient(180deg, #c0392b 0%, #111 100%);
            border: 4px solid #fff;
            border-radius: 30px;
            padding: 40px;
            text-align: center;
            color: #fff;
        }

        .btn-restart {
            background: #f1c40f;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 20px;
            font-weight: 900;
            cursor: pointer;
            margin-top: 20px;
            border: none;
            box-shadow: 0 5px 0 #d35400;
        }
    </style>
</head>
<body>
    <!-- [3/6] HTML: 構造の完全修正 -->
    <canvas id="gameCanvas"></canvas>

    <div id="ui-root">
        <div id="exp-header"><div id="exp-bar"></div></div>
        
        <div id="stats-panel">
            <div id="lv-badge">Lv. 1</div>
            <div id="kill-count">0</div>
        </div>

        <div id="inventory-panel">
            <div id="atk-slots" style="display:flex; gap:5px;">
                <div class="slot" id="slot-atk-0"></div>
                <div class="slot" id="slot-atk-1"></div>
                <div class="slot" id="slot-atk-2"></div>
                <div class="slot" id="slot-atk-3"></div>
                <div class="slot" id="slot-atk-4"></div>
                <div class="slot" id="slot-atk-5"></div>
            </div>
            <div id="pas-slots" style="display:flex; gap:5px; margin-top:5px;">
                <div class="slot" id="slot-pas-0"></div>
                <div class="slot" id="slot-pas-1"></div>
                <div class="slot" id="slot-pas-2"></div>
                <div class="slot" id="slot-pas-3"></div>
                <div class="slot" id="slot-pas-4"></div>
                <div class="slot" id="slot-pas-5"></div>
            </div>
        </div>
    </div>

    <!-- 選択画面 -->
    <div id="upgrade-overlay" class="overlay">
        <h2 id="menu-title" style="color:#f1c40f; font-size:40px;">SKILL UP!</h2>
        <div class="card-container" id="card-options"></div>
    </div>

    <!-- 死亡画面 -->
    <div id="gameover-overlay" class="overlay">
        <div id="gameover-panel">
            <h1>GAME OVER</h1>
            <p>KILLS: <span id="final-kills">0</span></p>
            <button class="btn-restart" onclick="location.reload()">RETRY</button>
        </div>
    </div>

    <!-- JavaScriptは次の[4/6]へ続きます -->
<script>
/* --- [4/6] JavaScript: 全スキル・進化・物理パラメータ・完全データベース --- */

/**

 * 各武器は固有の物理アルゴリズムID(t)を持ち、進化条件(e)と進化名(r)を持つ
 */
const GAMEDATA = {
    // 【メイン武器】枠 (最初に選択、固有の物理ロジックを持つ)

        revolver: { 
            n: "リボルバー", e: "power", r: "死神", t: "SNIPE",

        },
        void: { 
            n: "破壊の力", e: "exo", r: "新生の虚無", t: "BLACKHOLE",

        },
        light: {

            dmg: 10, spd: 0, cd: 45, s: 22, d: "巨大な剣気による広域攻撃。全方向をなぎ倒す" 
        }
    },

    // 【攻撃スキル】枠 (最大5枠。固有の物理シミュレーションを持つ)
    sub: {
        soccer: { 
            n: "サッカーボール", e: "shoes", r: "量子ボール", t: "BOUNCE_PHYSICS", 
            dmg: 8, spd: 11, cd: 85, s: 10, d: "画面内を高速で跳ね回り敵を粉砕する" 
        },
        lightning: { 
            n: "雷発生器", e: "cube", r: "ジャッジメント", t: "THUNDER_STRIKE", 
            dmg: 40, spd: 0, cd: 55, s: 15, d: "ランダムな敵の頭上に致命的な落雷を見舞う" 
        },
        guardian: { 
            n: "ガーディアン", e: "exo", r: "ディフェンダー", t: "ROTATING_ORBIT", 
            dmg: 3, spd: 0.09, cd: 0, s: 20, d: "周囲を回転し敵を弾き飛ばす。弾を消す効果あり" 
        },
        force: { 
            n: "力場発生器", e: "drink", r: "重力場", t: "AURA_FIELD", 
            dmg: 1, spd: 0, cd: 0, s: 120, d: "周囲にダメージと鈍足効果を与えるバリアを展開" 
        },
        drill: { 
            n: "ドリルショット", e: "ammo", r: "ホイッスル", t: "BOUNCE_TRACKING", 
            dmg: 9, spd: 13, cd: 65, s: 8, d: "敵を貫通し跳ね返る。進化後は自動追尾に変化" 
        },
        rocket: { 
            n: "ロケット発射器", e: "bomb", r: "シャークアタック", t: "MISSILE_BLAST", 
            dmg: 30, spd: 9, cd: 95, s: 22, d: "着弾時に巨大な爆発を起こすミサイルを放つ" 
        },
        molotov: { 
            n: "火炎瓶", e: "oil", r: "燃料樽", t: "FIRE_ZONE", 
            dmg: 2, spd: 0, cd: 75, s: 70, d: "地面を広範囲に炎上させ持続ダメージを与える" 
        },
        brick: { 
            n: "レンガ", e: "hp", r: "鉄鉄球", t: "ARC_DROP", 
            dmg: 25, spd: 16, cd: 60, s: 16, d: "上空へ投げ落とす重量攻撃。進化後は八方向に飛散" 
        },
        laser: { 
            n: "レーザー発射器", e: "diffuser", r: "死の光線", t: "ZIGZAG_LASER", 
            dmg: 12, spd: 11, cd: 65, s: 5, d: "ジグザグの光線で敵を貫き鈍足化させる" 
        },
        boomerang: { 
            n: "ブーメラン", e: "magnet", r: "マグネットダーツ", t: "CIRCLE_RETURN", 
            dmg: 10, spd: 13, cd: 75, s: 12, d: "円を描いて戻ってくる。進化後は分裂して攻撃" 
        },
        droneA: { 
            n: "ドローンA", e: "droneB", r: "破壊者", t: "DRONE_AUTO", 
            dmg: 5, spd: 15, cd: 18, s: 6, d: "自動攻撃ミサイルを連射する(A型)" 
        },
        droneB: { 
            n: "ドローンB", e: "droneA", r: "破壊者", t: "DRONE_AUTO", 
            dmg: 5, spd: 15, cd: 18, s: 6, d: "自動攻撃ミサイルを連射する(B型)" 
        }
    },

    // 【補助スキル】枠 (最大6枠。演算ロジックにステータス補正を注入する)
    pas: {
        power: { n: "強力銃弾", v: 0.2, d: "全攻撃のダメージ+20%" },
        hp: { n: "フィットネスガイド", v: 0.2, d: "最大HP上限+20%" },
        drink: { n: "エナジードリンク", v: 2, d: "5秒毎にHPを一定量回復する" },
        shoes: { n: "運動靴", v: 0.12, d: "移動速度+12%" },
        exo: { n: "外骨格腕輪", v: 0.25, d: "スキルの持続時間+25%" },
        cube: { n: "エナジーキューブ", v: 0.12, d: "攻撃の間隔(CD)-12%" },
        magnet: { n: "強力マグネット", v: 0.5, d: "アイテム回収範囲+50%" },
        bomb: { n: "高性能爆薬", v: 0.25, d: "攻撃の範囲とサイズ+25%" },
        ammo: { n: "弾薬推進器", v: 0.25, d: "弾速・飛行速度+25%" },
        oil: { n: "石油債券", v: 0.25, d: "獲得経験値+25%" },
        armor: { n: "浪人の鎧", v: 0.15, d: "被ダメージを15%軽減" },
        diffuser: { n: "エナジーディフューザー", v: 0.5, d: "攻撃判定の持続を大幅強化" },
        god: { n: "無敵モード", v: 1, d: "全ダメージ無効(神)", god: true }
    }
};

// --- グローバル状態管理 ---
const World = {
    p: {
        x: window.innerWidth / 2, y: window.innerHeight / 2,
        lv: 1, exp: 0, next: 5, hp: 100, max: 100, kills: 0,
        isGod: false,
        inv: { main: null, sub: {}, pas: {} }
    },
    phys: {
        bullets: [], enemies: [], gems: [], labels: []
    },
    sys: {
        frame: 0, spawnRate: 35, maxEnemies: 120, isPaused: true,
        canvasW: window.innerWidth, canvasH: window.innerHeight
    }
};

// リサイズ対応
window.addEventListener('resize', () => {
    World.sys.canvasW = canvas.width = window.innerWidth;
    World.sys.canvasH = canvas.height = window.innerHeight;
});

// 進化(Evolution)可能性判定
function checkEvoStatus(id) {
    const p = World.p;
    if (p.inv.main && p.inv.main.id === id) {
        const weapon = GAMEDATA.main[id];
        return (p.inv.main.lv >= 5 && p.inv.pas[weapon.e]);
    }
    if (p.inv.sub[id] >= 5) {
        const skill = GAMEDATA.sub[id];
        if (skill.s) return (p.inv.sub[skill.e] >= 5);
        return !!p.inv.pas[skill.e];
    }
    return false;
}

// ターゲット検索(距離の2乗で高速化)
function getNearest() {
    if (!World.phys.enemies.length) return null;
    let minD = Infinity;
    let target = null;
    const p = World.p;
    for (let i = 0; i < World.phys.enemies.length; i++) {
        const e = World.phys.enemies[i];
        const d = (p.x - e.x)**2 + (p.y - e.y)**2;
        if (d < minD) { minD = d; target = e; }
    }
    return target;
}
/* 4/6終了：次項 [5/6] では、このデータベースを使用して、
   全30種の固有物理アルゴリズムと、フリーズしない衝突検知ロジックを実装します。 */
/* --- [5/6] JavaScript: コア物理・全武器挙動シミュレーションセクション --- */

const keys = {};
window.onkeydown = e => { 
    keys[e.code] = true; 
    if(e.code === 'KeyG') { World.p.isGod = !World.p.isGod; console.log("GOD_MODE:", World.p.isGod); }
};
window.onkeyup = e => keys[e.code] = false;

/** 弾丸生成：パッシブスキルの補正をここで一括注入 */
function spawnProjectile(x, y, vx, vy, opts) {
    const p = World.p;
    const ammoMod = 1 + (p.inv.pas.ammo || 0) * 0.25; // 弾速UP
    World.phys.bullets.push({
        x: x, y: y,
        vx: vx * ammoMod, vy: vy * ammoMod,
        dmg: opts.dmg || 5,
        s: opts.s || 10,
        c: opts.color || "#fff",
        life: opts.life || 300,
        bounce: opts.bounce || 0,
        trk: opts.track || false,
        gravity: opts.gravity || 0,
        blast: opts.blast || 0,
        pull: opts.pull || false,
        area: opts.isArea || false,
        pierce: opts.pierce || false
    });
}

/** 武器実行メイン：全スロットのクールタイムとアルゴリズムを管理 */
function processWeapons() {
    if (World.sys.isPaused) return;
    const p = World.p;
    const frame = World.sys.frame;
    const cdMod = 1 - (p.inv.pas.cube || 0) * 0.12; // クールタイム短縮

    // 1. メイン武器（固有ベクトル演算）
    if (p.inv.main) {
        const id = p.inv.main.id;
        const lv = p.inv.main.lv;
        const isEvo = lv >= 6;
        const data = GAMEDATA.main[id];
        const currentCD = Math.max(5, (isEvo ? data.cd * 0.4 : data.cd) * cdMod);

        if (frame % Math.floor(currentCD) === 0) {
            const target = getNearest();
            const dmgBase = (isEvo ? data.dmg * 3 : data.dmg) * (1 + (p.inv.pas.power || 0) * 0.2);
            const szMod = 1 + (p.inv.pas.bomb || 0) * 0.25;

            switch(data.t) {
                case "TRACKING": // クナイ・幽霊手裏剣
                    if (target) {
                        const a = Math.atan2(target.y - p.y, target.x - p.x);
                        const cnt = isEvo ? 3 : 1;
                        for(let i=0; i<cnt; i++) spawnProjectile(p.x, p.y, Math.cos(a + (i-1)*0.1)*data.spd, Math.sin(a + (i-1)*0.1)*data.spd, { dmg: dmgBase, s: 8*szMod, color: isEvo?"#fff":"#ff0" });
                    }
                    break;
                case "FAN_SHOT": // ショットガン・ガトリング
                    if (target) {
                        const baseA = Math.atan2(target.y - p.y, target.x - p.x);
                        const cnt = isEvo ? 1 : 5;
                        for(let i=0; i<cnt; i++) spawnProjectile(p.x, p.y, Math.cos(isEvo?baseA:baseA+(i-2)*0.2)*20, Math.sin(isEvo?baseA:baseA+(i-2)*0.2)*20, { dmg: dmgBase, s: 6*szMod, life: isEvo?100:35 });
                    }
                    break;
                case "SWING_ARC": // バット
                    const swA = target ? Math.atan2(target.y-p.y, target.x-p.x) : 0;
                    for(let i=0; i<12; i++) spawnProjectile(p.x+Math.cos(swA+(i-6)*0.15)*60, p.y+Math.sin(swA+(i-6)*0.15)*60, 0, 0, { dmg: dmgBase, s: 35*szMod, life: 2, isArea: true, pierce: true });
                    break;
                case "SLASH_DUAL": // カタナ
                    const slA = target ? Math.atan2(target.y-p.y, target.x-p.x) : 0;
                    [slA, slA + Math.PI].forEach(a => {
                        for(let d=20; d<150*szMod; d+=25) spawnProjectile(p.x+Math.cos(a)*d, p.y+Math.sin(a)*d, 0, 0, { dmg: dmgBase, s: 40, life: 3, isArea: true, pierce: true, color: "#95afc0" });
                    });
                    break;
                case "BLACKHOLE": // 破壊の力
                    if (target) {
                        const a = Math.atan2(target.y - p.y, target.x - p.x);
                        spawnProjectile(p.x, p.y, Math.cos(a)*8, Math.sin(a)*8, { dmg: dmgBase, s: 20*szMod, pull: true, life: 150, color: "#000", blast: isEvo?220:140 });
                    }
                    break;
                case "WAVE_PENTAGON": // ライトチェイサー
                    const waveBase = frame * 0.1;
                    for(let i=0; i<5; i++) spawnProjectile(p.x, p.y, Math.cos(waveBase+i*1.25)*10, Math.sin(waveBase+i*1.25)*10, { dmg: dmgBase, s: 45*szMod, life: 50, pierce: true, color: "#badc58" });
                    break;
                case "SNIPE": // リボルバー
                    if(target){ const a=Math.atan2(target.y-p.y, target.x-p.x); spawnProjectile(p.x, p.y, Math.cos(a)*25, Math.sin(a)*25, {dmg:dmgBase*2, s:10, color:"#ecf0f1"}); }
                    break;
            }
        }
    }

    // 2. 攻撃スキルロジック
    Object.keys(p.inv.sub).forEach(id => {
        const lv = p.inv.sub[id];
        const isEvo = lv >= 6;
        const data = GAMEDATA.sub[id];
        const dmgBase = (isEvo ? data.dmg * 2.5 : data.dmg) * (1 + (p.inv.pas.power || 0) * 0.2);
        const szMod = 1 + (p.inv.pas.bomb || 0) * 0.25;

        if (data.t === "ROTATING_ORBIT") { // ガーディアン
            const cnt = isEvo ? 6 : 2 + Math.floor(lv/2);
            for(let i=0; i<cnt; i++) {
                const a = (frame*0.08) + (i*6.28/cnt), dist = isEvo?150:100;
                spawnProjectile(p.x+Math.cos(a)*dist, p.y+Math.sin(a)*dist, 0, 0, { dmg: dmgBase, s: (isEvo?35:22)*szMod, life: 1, isArea: true, color: "#ccc" });
            }
        } else if (data.t === "AURA_FIELD") { // 力場
            const r = (isEvo?220:130)*szMod;
            ctx.fillStyle = isEvo ? "rgba(0,0,0,0.2)" : "rgba(255,255,255,0.1)";
            ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 7); ctx.fill();
            World.phys.enemies.forEach(e => {
                if (((p.x-e.x)**2+(p.y-e.y)**2) < r**2) { e.hp -= dmgBase*0.1; e.spd = e.baseSpd*(isEvo?0.4:0.7); }
            });
        } else if (frame % Math.floor(data.cd * cdMod) === 0) {
            const target = getNearest();
            switch(data.t) {
                case "BOUNCE_PHYSICS": // サッカーボール
                    spawnProjectile(p.x, p.y, Math.cos(Math.random()*7)*data.spd, Math.sin(Math.random()*7)*data.spd, { dmg: dmgBase, s: 12*szMod, bounce: isEvo?99:6, color: isEvo?"#f0f":"#fff", life: 300 });
                    break;
                case "ARC_DROP": // レンガ
                    if (isEvo) for(let i=0; i<8; i++) spawnProjectile(p.x, p.y, Math.cos(i*0.8)*15, Math.sin(i*0.8)*15, { dmg: dmgBase, s: 30, pierce: true, color: "#777", life: 100 });
                    else spawnProjectile(p.x, p.y, (Math.random()-0.5)*15, -20, { dmg: dmgBase, s: 18, gravity: 0.9, color: "#a52a2a", life: 150 });
                    break;
                case "THUNDER_STRIKE": // 雷
                    for(let i=0; i<(isEvo?5:1); i++) {
                        const t = World.phys.enemies[Math.floor(Math.random()*World.phys.enemies.length)] || target;
                        if(t) spawnProjectile(t.x, t.y-400, 0, 35, { dmg: dmgBase, s: 20, life: 10, color: "#ff0", blast: isEvo?100:0 });
                    }
                    break;
                case "FIRE_ZONE": // 火炎瓶
                    const tx = p.x+(Math.random()-0.5)*600, ty = p.y+(Math.random()-0.5)*600;
                    spawnProjectile(tx, ty, 0, 0, { dmg: dmgBase*0.1, s: isEvo?160:90, color: isEvo?"#0af":"#f40", life: 180, isArea: true });
                    break;
                case "DRONE_AUTO": // ドローン
                    if(target){
                        const bx = p.x + (id==='droneA'?30:-30), by = p.y-20;
                        const a = Math.atan2(target.y-by, target.x-bx);
                        spawnProjectile(bx, by, Math.cos(a)*data.spd, Math.sin(a)*data.spd, { dmg: dmgBase, s: 6, color: "#fff", life: 60 });
                    }
                    break;
            }
        }
    });
}

/** 物理コア：移動・衝突・最適化 */
function updatePhysics() {
    if (World.sys.isPaused) return;
    const phys = World.phys; const p = World.p;

    // 1. 移動（運動靴補正）
    const playerSpeed = 4 * (1 + (p.inv.pas.shoes || 0) * 0.12);
    let mx = (keys['KeyD']||keys['ArrowRight']?1:0) - (keys['KeyA']||keys['ArrowLeft']?1:0);
    let my = (keys['KeyS']||keys['ArrowDown']?1:0) - (keys['KeyW']||keys['ArrowUp']?1:0);
    if (mx !== 0 || my !== 0) {
        const m = Math.hypot(mx, my);
        p.x += (mx/m)*playerSpeed; p.y += (my/m)*playerSpeed;
    }

    // 2. 弾丸更新
    for (let i = phys.bullets.length-1; i>=0; i--) {
        const b = phys.bullets[i];
        if (b.gravity) b.vy += b.gravity;
        b.x += b.vx; b.y += b.vy;
        if (b.bounce > 0 && (b.x<0 || b.x>World.sys.canvasW || b.y<0 || b.y>World.sys.canvasH)) {
            if (b.x<0 || b.x>World.sys.canvasW) b.vx *= -1;
            if (b.y<0 || b.y>World.sys.canvasH) b.vy *= -1;
            b.bounce--;
        }
        if (b.pull) {
            phys.enemies.forEach(e => {
                const dx = b.x-e.x, dy = b.y-e.y;
                if ((dx*dx+dy*dy) < 300**2) { e.x += dx*0.06; e.y += dy*0.06; }
            });
        }
        if (--b.life <= 0) phys.bullets.splice(i, 1);
    }

    // 3. 敵更新（距離の2乗でフリーズ防止）
    const armorMod = 1 - (p.inv.pas.armor || 0) * 0.15;
    for (let i = phys.enemies.length-1; i>=0; i--) {
        const e = phys.enemies[i];
        const dx = p.x-e.x, dy = p.y-e.y, d2 = dx*dx+dy*dy;
        const d = Math.sqrt(d2);
        e.x += (dx/d)*e.spd; e.y += (dy/d)*e.spd;

        if (d2 < (p.size+e.size)**2 && !p.isGod) {
            p.hp -= 0.6 * armorMod;
            if (p.hp <= 0) triggerGameOver();
        }

        for (let j = phys.bullets.length-1; j>=0; j--) {
            const b = phys.bullets[j];
            if (((e.x-b.x)**2+(e.y-b.y)**2) < (e.size+b.s)**2) {
                e.hp -= b.dmg;
                if (b.blast) executeExplosion(b.x, b.y, b.blast, b.dmg);
                if (!b.pierce && !b.area && !b.pull) phys.bullets.splice(j, 1);
                if (e.hp <= 0) { phys.gems.push({x:e.x, y:e.y}); phys.enemies.splice(i, 1); p.kills++; break; }
            }
        }
    }

    // 4. ジェム回収
    const magR = 120 * (1 + (p.inv.pas.magnet || 0) * 0.6);
    for (let i = phys.gems.length-1; i>=0; i--) {
        const g = phys.gems[i]; const d2 = (p.x-g.x)**2+(p.y-g.y)**2;
        if (d2 < magR**2) { g.x += (p.x-g.x)*0.2; g.y += (p.y-g.y)*0.2; }
        if (d2 < 25**2) { phys.gems.splice(i, 1); addExp(1); }
    }

    // 5. スポーン
    if (World.sys.frame % World.sys.spawnRate === 0 && phys.enemies.length < World.sys.maxEnemies) {
        const a = Math.random()*7, dist = 850;
        phys.enemies.push({ x: p.x+Math.cos(a)*dist, y: p.y+Math.sin(a)*dist, hp: 10+p.lv*10, maxHp: 10+p.lv*10, baseSpd: 2.2+p.lv*0.05, spd: 2.2, size: 18 });
    }
}

function executeExplosion(x, y, r, dmg) {
    World.phys.enemies.forEach(e => { if(((x-e.x)**2+(y-e.y)**2) < r**2) e.hp -= dmg; });
}

function addExp(v) {
    const p = World.p; p.exp += v * (1 + (p.inv.pas.oil||0)*0.25);
    if (p.exp >= p.next) { p.exp=0; p.next+=15; p.lv++; openUpgradeOverlay(); }
}

/* 5/6終了：次項 [6/6] で描画エンジンと進化抽選ロジックを統合し、全コードが完結します。 */
/* --- [6/6] JavaScript: 描画・進化抽選・システムメインループ完結セクション --- */

/**
 * アップグレード画面の生成ロジック
 * 進化(Evolve)を最優先し、次に所持スキルの強化、最後に新規取得を抽選する
 * 本家同様、スロットがいっぱいの場合は新規スキルは出さない
 */
function openUpgradeOverlay() {
    World.sys.isPaused = true;
    const overlay = document.getElementById('upgrade-overlay');
    const container = document.getElementById('card-options');
    const title = document.getElementById('menu-title');
    
    overlay.classList.add('active');
    container.innerHTML = '';

    const p = World.p;

    // -----------------------------------------------------------------
    // 1. 初回：メイン武器選択（ゲーム開始時）
    // -----------------------------------------------------------------
    if (!p.inv.main) {
        title.innerText = "メイン武器を選択せよ";
        Object.keys(GAMEDATA.main).forEach(id => {
            generateSkillCard(id, 'main', false, container);
        });
        return;
    }

    // -----------------------------------------------------------------
    // 2. レベルアップ：進化(Evolve)および通常スキルの抽選
    // -----------------------------------------------------------------
    title.innerText = "スキルアップグレード";
    let evoChoices = [];
    let normalChoices = [];

    // --- 【進化候補】の全スキャン ---
    // メイン武器の進化判定
    if (checkEvoStatus(p.inv.main.id)) {
        evoChoices.push({ id: p.inv.main.id, type: 'main', isEvo: true });
    }
    // サブスキルの進化判定
    Object.keys(p.inv.sub).forEach(id => {
        if (checkEvoStatus(id)) evoChoices.push({ id, type: 'sub', isEvo: true });
    });

    // --- 【通常候補】の全スキャン（枠制限を厳密に考慮） ---
    // 攻撃サブスキル候補
    Object.keys(GAMEDATA.sub).forEach(id => {
        const lv = p.inv.sub[id] || 0;
        // 所持済みでLv5未満なら強化候補
        if (lv > 0 && lv < 5) {
            normalChoices.push({ id, type: 'sub', isEvo: false });
        } 
        // 未所持で、攻撃スロット（最大5）に空きがあれば新規候補
        else if (lv === 0 && Object.keys(p.inv.sub).length < 5) {
            normalChoices.push({ id, type: 'sub', isEvo: false });
        }
    });

    // 補助スキル候補
    Object.keys(GAMEDATA.pas).forEach(id => {
        const lv = p.inv.pas[id] || 0;
        // 無敵(God)は特殊枠：レベルに関係なく抽選プールに低確率で入るように設定可
        if (id === 'god') { 
            if (!p.isGod) normalChoices.push({ id, type: 'pas', isEvo: false });
            return; 
        }
        // 所持済みでLv5未満なら強化候補
        if (lv > 0 && lv < 5) {
            normalChoices.push({ id, type: 'pas', isEvo: false });
        } 
        // 未所持で、補助スロット（最大6）に空きがあれば新規候補
        else if (lv === 0 && Object.keys(p.inv.pas).length < 6) {
            normalChoices.push({ id, type: 'pas', isEvo: false });
        }
    });

    // メイン武器自体の強化(Lv5まで)
    if (p.inv.main.lv < 5) {
        normalChoices.push({ id: p.inv.main.id, type: 'main', isEvo: false });
    }

    // -----------------------------------------------------------------
    // 3. 抽選アルゴリズム：進化を優先的に含め、最大3枚を選出
    // -----------------------------------------------------------------
    // 進化がある場合は必ず1枚は進化カードを出す
    let finalPool = [];
    if (evoChoices.length > 0) {
        finalPool.push(evoChoices[Math.floor(Math.random() * evoChoices.length)]);
    }
    
    // 残りの枠を通常候補からランダムに埋める
    let shuffledNormals = normalChoices.sort(() => 0.5 - Math.random());
    while (finalPool.length < 3 && shuffledNormals.length > 0) {
        let pick = shuffledNormals.pop();
        // 重複回避
        if (!finalPool.find(x => x.id === pick.id)) {
            finalPool.push(pick);
        }
    }

    // カードの生成
    finalPool.forEach(choice => {
        generateSkillCard(choice.id, choice.type, choice.isEvo, container);
    });
}

/**
 * スキルカードHTMLの動的構築
 */
function generateSkillCard(id, type, isEvo, container) {
    const p = World.p;
    const data = type === 'main' ? GAMEDATA.main[id] : (type === 'sub' ? GAMEDATA.sub[id] : GAMEDATA.pas[id]);
    const card = document.createElement('div');
    
    card.className = 'card';
    if (isEvo) card.classList.add('red');
    if (id === 'god') card.classList.add('gold');

    let currentLv = 0;
    if (type === 'main') currentLv = p.inv.main ? p.inv.main.lv : 0;
    else if (type === 'sub') currentLv = p.inv.sub[id] || 0;
    else currentLv = p.inv.pas[id] || 0;

    // 星（レベル）表示の生成
    let starsHtml = '';
    if (!isEvo) {
        for (let i = 0; i < 5; i++) {
            starsHtml += `<div class="level-dot ${i < currentLv ? 'active' : ''}"></div>`;
        }
    } else {
        starsHtml = `<span style="color:#fff; font-weight:900;">★★★ EVOLUTION ★★★</span>`;
    }

    card.innerHTML = `
        <div class="card-type">${isEvo ? 'EVOLUTION' : type.toUpperCase()}</div>
        <h3 class="card-title">${isEvo ? data.r : data.n}</h3>
        <div class="card-desc">${isEvo ? "究極の進化を遂げた！" : data.d}</div>
        <div class="level-container">${starsHtml}</div>
    `;

    card.onclick = () => {
        confirmSelection(id, type, isEvo);
        document.getElementById('upgrade-overlay').classList.remove('active');
        World.sys.isPaused = false;
    };

    container.appendChild(card);
}

/**
 * スキル習得・強化の確定処理
 */
function confirmSelection(id, type, isEvo) {
    const p = World.p;
    if (id === 'god') { p.isGod = true; return; }

    if (type === 'main') {
        if (!p.inv.main) p.inv.main = { id, lv: 1 };
        else p.inv.main.lv = isEvo ? 6 : p.inv.main.lv + 1;
    } else if (type === 'sub') {
        if (isEvo) {
            // ドローン合体の特殊ロジック
            if (id === 'droneA' || id === 'droneB') {
                delete p.inv.sub.droneA;
                delete p.inv.sub.droneB;
                p.inv.sub.destroyer = 6;
            } else {
                p.inv.sub[id] = 6;
            }
        } else {
            p.inv.sub[id] = (p.inv.sub[id] || 0) + 1;
        }
    } else if (type === 'pas') {
        p.inv.pas[id] = (p.inv.pas[id] || 0) + 1;
        // 即時反映系パッシブ：HP上限
        if (id === 'hp') {
            const boost = 25;
            p.max += boost; p.hp += boost;
        }
    }
    updateInventoryUI();
}

/**
 * 右側インベントリスロットの完全同期
 */
function updateInventoryUI() {
    const p = World.p;
    // 攻撃系スロット
    let combinedAtk = [];
    if (p.inv.main) combinedAtk.push({ id: p.inv.main.id, lv: p.inv.main.lv, n: GAMEDATA.main[p.inv.main.id].n });
    Object.keys(p.inv.sub).forEach(id => combinedAtk.push({ id, lv: p.inv.sub[id], n: GAMEDATA.sub[id].n }));

    for (let i = 0; i < 6; i++) {
        const slot = document.getElementById(`slot-atk-${i}`);
        if (combinedAtk[i]) {
            slot.classList.add('has-item');
            slot.innerHTML = `<span class="icon-weapon">${combinedAtk[i].n.charAt(0)}</span>
                <div class="slot-stars">${Array(Math.min(5, combinedAtk[i].lv)).fill().map(()=>`<div class="star active"></div>`).join('')}</div>`;
            if (combinedAtk[i].lv >= 6) slot.style.borderColor = "#ff4757";
        }
    }

    // 補助系スロット
    const pasKeys = Object.keys(p.inv.pas);
    for (let i = 0; i < 6; i++) {
        const slot = document.getElementById(`slot-pas-${i}`);
        if (pasKeys[i]) {
            const id = pasKeys[i];
            slot.classList.add('has-item');
            slot.innerHTML = `<span class="icon-support">${GAMEDATA.pas[id].n.charAt(0)}</span>
                <div class="slot-stars">${Array(p.inv.pas[id]).fill().map(()=>`<div class="star active"></div>`).join('')}</div>`;
        }
    }
}

/**
 * メインレンダリング・ループ
 */
function render() {
    // 画面揺れ(Screen Shake)
    let offsetX = 0, offsetY = 0;
    if (World.sys.shake > 0) {
        offsetX = (Math.random() - 0.5) * World.sys.shake;
        offsetY = (Math.random() - 0.5) * World.sys.shake;
        World.sys.shake *= 0.85;
    }

    ctx.setTransform(1, 0, 0, 1, offsetX, offsetY);
    ctx.clearRect(-100, -100, canvas.width + 200, canvas.height + 200);

    const p = World.p;
    const phys = World.phys;

    // 1. ジェム（経験値）
    phys.gems.forEach(g => {
        ctx.fillStyle = "#2ecc71";
        ctx.beginPath(); ctx.arc(g.x, g.y, 5, 0, 7); ctx.fill();
        ctx.strokeStyle = "#fff"; ctx.lineWidth = 1; ctx.stroke();
    });

    // 2. 敵ユニット
    phys.enemies.forEach(e => {
        ctx.fillStyle = "#2c3e50";
        ctx.fillRect(e.x - 12, e.y - 12, 24, 24);
        // HPバー
        ctx.fillStyle = "#444"; ctx.fillRect(e.x - 15, e.y + 18, 30, 4);
        ctx.fillStyle = "#ff4757"; ctx.fillRect(e.x - 15, e.y + 18, 30 * (e.hp / e.maxHp), 4);
    });

    // 3. 全てのプロジェクタイル（弾・エフェクト）
    phys.bullets.forEach(b => {
        ctx.fillStyle = b.c;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.s, 0, 7); ctx.fill();
        if (b.trk) { // 追尾弾の光沢
            ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.stroke();
        }
    });

    // 4. プレイヤー
    if (p.isGod) {
        ctx.shadowBlur = 40; ctx.shadowColor = "#fff200";
        ctx.fillStyle = World.sys.frame % 4 < 2 ? "#fff200" : "#ffffff";
    } else {
        ctx.fillStyle = "#00a8ff";
    }
    ctx.fillRect(p.x - 15, p.y - 15, 30, 30);
    ctx.shadowBlur = 0;

    // プレイヤーHPバー
    ctx.fillStyle = "#111"; ctx.fillRect(p.x - 25, p.y + 25, 50, 8);
    ctx.fillStyle = p.hp > p.max * 0.3 ? "#2ed573" : "#ff4757";
    ctx.fillRect(p.x - 25, p.y + 25, 50 * (Math.max(0, p.hp / p.max)), 8);

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    
    // UIテキスト更新
    document.getElementById('exp-bar').style.width = (p.exp / p.next * 100) + "%";
    document.getElementById('lv-badge').innerText = `Lv. ${p.lv}`;
    document.getElementById('kill-count').innerText = p.kills;
}

/**
 * ゲームオーバー処理
 */
function triggerGameOver() {
    World.sys.isPaused = true;
    document.getElementById('gameover-overlay').classList.add('active');
    document.getElementById('final-kills').innerText = World.p.kills;
}

/**
 * メインループの起動
 */
function mainLoop() {
    World.sys.frame++;
    updatePhysics();  // [5/6]で定義
    processWeapons(); // [5/6]で定義
    render();
    requestAnimationFrame(mainLoop);
}

// -----------------------------------------------------------------
// ゲームの完全起動
// -----------------------------------------------------------------
window.onload = () => {
    // スロットの初期化
    for(let i=0; i<6; i++) {
        document.getElementById(`slot-atk-${i}`).innerHTML = "";
        document.getElementById(`slot-pas-${i}`).innerHTML = "";
    }
    
    // 初回の武器選択画面を出す
    openUpgradeOverlay();
    
    // ループ開始
    mainLoop();
};
