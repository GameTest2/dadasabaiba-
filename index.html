<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ダダサバイバー完全移植版・改</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: 'Arial Black', sans-serif; user-select: none; }
        canvas { display: block; background: #3d5e35; image-rendering: pixelated; }

        /* GUI: 画面上部の青い経験値バー */
        #ui { position: absolute; top: 0; left: 0; width: 100%; pointer-events: none; z-index: 100; }
        #exp-container { width: 100%; height: 18px; background: #333; border-bottom: 3px solid #000; }
        #exp-fill { width: 0%; height: 100%; background: #00a8ff; box-shadow: inset 0 -4px rgba(0,0,0,0.3); transition: width 0.1s; }
        #stats { display: flex; justify-content: space-between; color: white; padding: 10px 20px; text-shadow: 2px 2px #000; font-size: 22px; }
        
        /* スキル選択・武器選択オーバーレイ */
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 200; pointer-events: auto; }
        .card-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; max-width: 1000px; }
        
        /* スキルカードデザイン */
        .card { 
            background: linear-gradient(180deg, #f1c40f, #d4ac0d); border-radius: 15px; padding: 15px; width: 220px; 
            text-align: center; cursor: pointer; border: 5px solid #000; border-bottom-width: 12px; 
            transition: transform 0.1s; color: #222; 
        }
        .card:hover { transform: scale(1.05); }
        .card:active { transform: translateY(6px); border-bottom-width: 6px; }
        
        /* 進化（赤）カード専用エフェクト */
        .card.red { 
            background: linear-gradient(180deg, #ff4757, #ff6b81); color: white; 
            border-color: #fff; animation: evo-glow 0.8s infinite alternate; 
        }
        @keyframes evo-glow { from { box-shadow: 0 0 10px #ff4757; } to { box-shadow: 0 0 30px #ff6b81; } }
        
        h2 { color: #f1c40f; font-size: 42px; margin-bottom: 30px; text-shadow: 4px 4px #000; letter-spacing: 2px; }
        .type-tag { font-size: 12px; background: rgba(0,0,0,0.2); padding: 2px 8px; border-radius: 10px; font-weight: bold; }
        .desc { font-size: 13px; margin-top: 10px; font-weight: bold; background: rgba(0,0,0,0.1); padding: 8px; border-radius: 6px; min-height: 40px; }
    </style>
</head>
<body>
    <div id="ui">
        <div id="exp-container"><div id="exp-fill"></div></div>
        <div id="stats"><div id="lv-txt">Lv.1</div><div id="kill-txt">KILLS: 0</div></div>
    </div>

    <!-- 選択画面 -->
    <div id="menu" class="overlay">
        <h2 id="menu-title">メイン武器を選択せよ</h2>
        <div id="options" class="card-list"></div>
    </div>

    <canvas id="game"></canvas>

<script>
// --- [1/4] 武器・スキル・進化（Evo）データベース完全版 ---
const DB = {
    // 【メイン武器】枠（n:名称, e:必要補助, r:進化名, t:攻撃タイプ, d:説明）
    main: {
        kunai: { n: "クナイ", e: "power", r: "幽霊手裏剣", t: "track", d: "自動追尾攻撃。放置プレイの相棒。" },
        shotgun: { n: "ショットガン", e: "bomb", r: "ガトリング", t: "fan", d: "前方への強力な射撃。進化で連射の嵐。" },
        bat: { n: "バット", e: "hp", r: "ルシール", t: "swing", d: "扇状のノックバック攻撃。生存率UP。" },
        katana: { n: "カタナ", e: "armor", r: "妖刀正宗", t: "slash", d: "前後を切り裂く剣気攻撃。" },
        revolver: { n: "リボルバー", e: "power", r: "死神", t: "aim", d: "単体への超火力精密射撃。" },
        void: { n: "破壊の力", e: "exo", r: "新生の虚無", t: "blackhole", d: "敵を吸い込むブラックホールを生成。" },
        light: { n: "ライトチェイサー", e: "armor", r: "不滅の灯", t: "wave", d: "巨大な五連剣気による広域攻撃。" }
    },
    // 【攻撃スキル】枠
    sub: {
        soccer: { n: "サッカーボール", e: "shoes", r: "量子ボール", t: "bounce", d: "跳ね返る高速攻撃。狭い場所で最強。" },
        lightning: { n: "雷発生器", e: "cube", r: "ジャッジメント", t: "thunder", d: "ランダムな敵の頭上に落雷。" },
        guardian: { n: "ガーディアン", e: "exo", r: "ディフェンダー", t: "rotate", d: "周囲を回転し敵を弾き飛ばす。" },
        force: { n: "力場発生器", e: "drink", r: "重力場", t: "aura", d: "周囲にダメージと鈍足効果のバリア。" },
        drill: { n: "ドリルショット", e: "ammo", r: "ホイッスル", t: "bounce", d: "敵を貫通し跳ね返る。進化で追尾。" },
        rocket: { n: "ロケット", e: "bomb", r: "シャークアタック", t: "rocket", d: "着弾時に広範囲爆発を起こす。" },
        molotov: { n: "火炎瓶", e: "oil", r: "燃料樽", t: "fire", d: "地面を燃やし持続ダメージ。毒霧除去。" },
        brick: { n: "レンガ", e: "hp", r: "鉄鉄球", t: "drop", d: "放物線を描いて投げ落とす重量攻撃。" },
        laser: { n: "レーザー", e: "diffuser", r: "死の光線", t: "laser", d: "ジグザグ光線。進化で鈍足効果。" },
        boomerang: { n: "ブーメラン", e: "magnet", r: "マグネットダーツ", t: "circle", d: "戻ってくる円盤。進化で分裂。" },
        droneA: { n: "ドローンA", e: "droneB", r: "破壊者", t: "drone", d: "近くの敵を自動狙撃するミサイルA。" },
        droneB: { n: "ドローンB", e: "droneA", r: "破壊者", t: "drone", d: "近くの敵を自動狙撃するミサイルB。" }
    },
    // 【補助スキル】枠
    pas: {
        power: { n: "強力銃弾", d: "攻撃力+20%。" },
        hp: { n: "フィットネスG", d: "HP上限+20%。" },
        drink: { n: "エナジードリンク", d: "5秒毎にHP回復。" },
        shoes: { n: "運動靴", d: "移動速度+10%。" },
        exo: { n: "外骨格腕輪", d: "スキル持続時間+20%。" },
        cube: { n: "エナジーキューブ", d: "攻撃間隔-10%。" },
        magnet: { n: "強力マグネット", d: "回収範囲+40%。" },
        bomb: { n: "高性能爆薬", d: "攻撃範囲+20%。" },
        ammo: { n: "弾薬推進器", d: "弾速・飛行速度+20%。" },
        oil: { n: "石油債券", d: "獲得経験値+20%。" },
        armor: { n: "浪人の鎧", d: "被ダメージ10%軽減。" },
        diffuser: { n: "ディフューザー", d: "特定攻撃の効果強化。" }
    }
};

// Part 1 終了。次のチャット Part 2 で【枠制限・移動・敵・ジェム管理】を追加します。
// --- [2/4] ゲームコア・スロット管理・物理演算セクション ---

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// ゲームステート
let state = 'menu'; // menu, play
let frame = 0, kills = 0;

// プレイヤーデータ（インベントリ枠）
const p = {
    x: canvas.width / 2, y: canvas.height / 2,
    lv: 1, exp: 0, next: 5, hp: 100, max: 100,
    baseSpd: 3.5, size: 20, baseMag: 100,
    // 所持管理スロット
    mainW: null,    // {id, lv} 1枠固定
    atkS: {},       // {id: lv} 最大5枠
    pasS: {}        // {id: lv} 最大6枠
};

let bullets = [], enemies = [], gems = [];
const keys = {};

window.onkeydown = e => keys[e.code] = true;
window.onkeyup = e => keys[e.code] = false;

// ---------------------------------------------------------
// メイン更新ループ
// ---------------------------------------------------------

function update() {
    if (state !== 'play') return;
    frame++;

    // 1. 移動処理（運動靴：shoes 効果をリアルタイム反映）
    const spdMod = 1 + (p.pasS.shoes || 0) * 0.1;
    const mx = (keys['KeyD']||keys['ArrowRight']?1:0) - (keys['KeyA']||keys['ArrowLeft']?1:0);
    const my = (keys['KeyS']||keys['ArrowDown']?1:0) - (keys['KeyW']||keys['ArrowUp']?1:0);
    
    if (mx !== 0 || my !== 0) {
        const angle = Math.atan2(my, mx);
        p.x += Math.cos(angle) * p.baseSpd * spdMod;
        p.y += Math.sin(angle) * p.baseSpd * spdMod;
    }

    // 2. 敵の生成（負荷抑制：100体制限 & レベルに応じた強化）
    if (frame % 25 === 0 && enemies.length < 100) {
        const ang = Math.random() * 6.28;
        enemies.push({
            x: p.x + Math.cos(ang) * 800,
            y: p.y + Math.sin(ang) * 800,
            hp: 6 + (p.lv * 4), 
            maxHp: 6 + (p.lv * 4),
            spd: 2.1 + (p.lv * 0.05), 
            size: 18
        });
    }

    // 3. 敵のAIとプレイヤー衝突判定（浪人の鎧：armor 効果反映）
    const defMod = 1 - (p.pasS.armor || 0) * 0.1;
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        const dx = p.x - e.x, dy = p.y - e.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        
        e.x += (dx / dist) * e.spd;
        e.y += (dy / dist) * e.spd;

        if (dist < p.size + e.size) {
            p.hp -= 0.4 * defMod;
            if (p.hp <= 0) location.reload(); // 死亡リセット
        }
    }

    // 4. 経験値ジェムの吸い寄せと回収（強力マグネット・石油債券反映）
    const magRange = p.baseMag * (1 + (p.pasS.magnet || 0) * 0.5);
    const expMod = 1 + (p.pasS.oil || 0) * 0.2;
    for (let i = gems.length - 1; i >= 0; i--) {
        const g = gems[i];
        const d = Math.hypot(p.x - g.x, p.y - g.y);
        if (d < magRange) {
            g.x += (p.x - g.x) * 0.25;
            g.y += (p.y - g.y) * 0.25;
        }
        if (d < 20) {
            gems.splice(i, 1);
            p.exp += 1 * expMod;
            if (p.exp >= p.next) {
                p.exp = 0; p.next += 10; p.lv++;
                openSkillMenu(); // Part 4で詳細実装
            }
        }
    }

    // 5. HP継続回復（エナジードリンク：drink 効果反映）
    if (p.pasS.drink && frame % 300 === 0) {
        p.hp = Math.min(p.max, p.hp + p.pasS.drink * 2);
    }

    // 次のパートで定義する武器実行関数を呼び出し
    if (typeof processAttacks === 'function') processAttacks();
}

// ---------------------------------------------------------
// 補助関数
// ---------------------------------------------------------

function getTarget() {
    if (enemies.length === 0) return null;
    let minD = Infinity, target = null;
    for (const e of enemies) {
        const d = Math.hypot(p.x - e.x, p.y - e.y);
        if (d < minD) { minD = d; target = e; }
    }
    return target;
}

// Part 2 終了。次のチャット Part 3 で【全30種の武器攻撃ロジック・物理演算・進化後の特殊挙動】を書き込みます。
// --- [3/4] 武器・スキル固有攻撃ロジックセクション ---

function processAttacks() {
    // 1. メイン武器の実行
    if (p.mainW) {
        runBehavior(p.mainW.id, p.mainW.lv, true);
    }
    // 2. 攻撃スキルの実行
    Object.keys(p.atkS).forEach(id => {
        runBehavior(id, p.atkS[id], false);
    });
    // 3. 弾の移動と衝突判定
    updateProjectiles();
}

function runBehavior(id, lv, isMain) {
    const data = isMain ? DB.main[id] : DB.sub[id];
    const isRed = lv >= 6;
    // エナジーキューブ(cube)によるCD短縮反映
    const baseCD = isRed ? 15 : (45 - (p.pasS.cube || 0) * 5);
    const cd = Math.max(5, baseCD);

    if (frame % cd === 0) {
        const target = getTarget();
        // 強力銃弾(power)による攻撃力UP反映
        const dmg = (isRed ? 12 : 3) * (1 + (p.pasS.power || 0) * 0.2);
        // 高性能爆薬(bomb)による範囲拡大反映
        const sz = 1 + (p.pasS.bomb || 0) * 0.25;

        switch(data.t) {
            case "track": // クナイ・手裏剣・進化ドリル
                if (target) {
                    const a = Math.atan2(target.y - p.y, target.x - p.x);
                    spawnB(p.x, p.y, Math.cos(a)*18, Math.sin(a)*18, { dmg, c: isRed?"#fff":"#ff0", s: 6*sz });
                }
                break;
            case "fan": // ショットガン(ガトリング)
                const baseA = target ? Math.atan2(target.y - p.y, target.x - p.x) : 0;
                const cnt = isRed ? 1 : 5;
                for(let i=0; i<cnt; i++){
                    const a = isRed ? baseA : baseA + (i-2)*0.2;
                    spawnB(p.x, p.y, Math.cos(a)*20, Math.sin(a)*20, { dmg, c: "#fff", s: 5*sz, life: isRed?100:35 });
                }
                break;
            case "bounce": // ドリル・サッカーボール
                const ang = Math.random() * 6.28;
                spawnB(p.x, p.y, Math.cos(ang)*11, Math.sin(ang)*11, { dmg, b: isRed?99:5, trk: (id==='drill'&&isRed), c: isRed?"#f0f":"#0ff", s: 10*sz });
                break;
            case "drop": // レンガ(鉄鉄球)
                if (isRed) {
                    for(let i=0; i<8; i++) spawnB(p.x, p.y, Math.cos(i*0.8)*12, Math.sin(i*0.8)*12, { dmg, prc: true, c: "#888", s: 28*sz });
                } else {
                    spawnB(p.x, p.y, (Math.random()-0.5)*12, -18, { g: 0.8, dmg, c: "#a52a2a", s: 18*sz });
                }
                break;
            case "blackhole": // 破壊の力
                if (target) {
                    const a = Math.atan2(target.y - p.y, target.x - p.x);
                    spawnB(p.x, p.y, Math.cos(a)*6, Math.sin(a)*6, { dmg, life: 120, bl: isRed?200:120, c: "#000", s: 15*sz, pull: true });
                }
                break;
            case "rocket": // ロケット(サメ)
                if (target) {
                    const a = Math.atan2(target.y - p.y, target.x - p.x);
                    spawnB(p.x, p.y, Math.cos(a)*8, Math.sin(a)*8, { dmg, bl: isRed?180:100, c: isRed?"#f33":"#fb0", s: 22*sz });
                }
                break;
            case "thunder": // 雷(ジャッジメント)
                if (target) spawnB(target.x, target.y - 400, 0, 30, { dmg: 20, life: 15, c: "#ff0", s: 15*sz });
                break;
            case "fire": // 火炎瓶(樽)
                const tx = p.x + (Math.random()-0.5)*500, ty = p.y + (Math.random()-0.5)*400;
                spawnB(tx, ty, 0, 0, { dmg: 0.2, life: 150, c: isRed?"#0af":"#f50", s: (isRed?125:75)*sz, area: true });
                break;
        }
    }

    // 常時発生系：ガーディアン(rotate)・力場(aura)
    if (data.t === "rotate") {
        const count = isRed ? 6 : 2 + Math.floor(lv/2);
        for(let i=0; i<count; i++) {
            const ang = (frame*0.09) + (i*6.28/count), d = isRed ? 140 : 100;
            spawnB(p.x+Math.cos(ang)*d, p.y+Math.sin(ang)*d, 0, 0, { dmg: 0.5, life: 1, c: "#ccc", s: (isRed?35:22)*sz, area: true });
        }
    }
    if (data.t === "aura") {
        const r = (isRed ? 200 : 120) * (1 + (p.pasS.bomb || 0) * 0.25);
        ctx.fillStyle = isRed ? "rgba(0,0,0,0.25)" : "rgba(255,255,255,0.15)";
        ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 7); ctx.fill();
        enemies.forEach(e => { if(Math.hypot(p.x-e.x, p.y-e.y) < r) { e.hp -= 0.15; e.spd *= isRed ? 0.45 : 0.75; } });
    }
}

function spawnB(x, y, vx, vy, o) {
    // 弾薬推進器(ammo)による弾速UP反映
    const spdM = 1 + (p.pasS.ammo || 0) * 0.2;
    bullets.push({ x, y, vx: vx*spdM, vy: vy*spdM, ...o, life: o.life || 300 });
}

function updateProjectiles() {
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        if (b.g) b.vy += b.g; // 重力
        if (b.trk && enemies.length) { // 追尾
            const e = getTarget();
            const a = Math.atan2(e.y - b.y, e.x - b.x);
            b.vx = Math.cos(a)*17; b.vy = Math.sin(a)*17;
        }
        b.x += b.vx; b.y += b.vy;
        
        if (b.b && (b.x<0 || b.x>canvas.width || b.y<0 || b.y>canvas.height)) {
            b.vx *= -1; b.vy *= -1; b.b--;
        }

        // 当たり判定
        enemies.forEach((e, ei) => {
            if (Math.hypot(e.x - b.x, e.y - b.y) < e.size + (b.s || 5)) {
                e.hp -= b.dmg;
                if (b.bl) { // 爆発
                    ctx.fillStyle = "rgba(255,165,0,0.6)"; ctx.beginPath(); ctx.arc(b.x, b.y, b.bl, 0, 7); ctx.fill();
                    enemies.forEach(ne => { if(Math.hypot(b.x-ne.x, b.y-ne.y) < b.bl) ne.hp -= b.dmg; });
                    bullets.splice(i, 1);
                } else if (!b.prc && !b.area && !b.pull) bullets.splice(i, 1);
                
                if (e.hp <= 0) { gems.push({x: e.x, y: e.y}); enemies.splice(ei, 1); kills++; }
            }
        });

        if (--b.life <= 0) bullets.splice(i, 1);
    }
}
// --- [4/4] 進化判定・描画エンジン・システム完結セクション ---

function openSkillMenu() {
    state = 'menu';
    const menu = document.getElementById('menu');
    const container = document.getElementById('options');
    const title = document.getElementById('menu-title');
    
    menu.style.display = 'flex';
    container.innerHTML = '';

    // 1. 進化候補の抽出
    let evoPool = [];
    // メイン武器の進化
    if (p.mainW && p.mainW.lv === 5 && p.pasS[DB.main[p.mainW.id].e]) {
        evoPool.push({ id: p.mainW.id, type: 'main', isEvo: true });
    }
    // サブスキルの進化
    Object.keys(p.atkS).forEach(id => {
        if (p.atkS[id] === 5 && p.pasS[DB.sub[id].e]) {
            evoPool.push({ id, type: 'sub', isEvo: true });
        }
    });

    // 2. 通常スキル候補の抽出
    let normalPool = [];
    // 攻撃スキルの追加（5枠まで）または強化
    Object.keys(DB.sub).forEach(id => {
        if (p.atkS[id] && p.atkS[id] < 5) normalPool.push({ id, type: 'sub' });
        else if (!p.atkS[id] && Object.keys(p.atkS).length < 5) normalPool.push({ id, type: 'sub' });
    });
    // 補助スキルの追加（6枠まで）または強化
    Object.keys(DB.pas).forEach(id => {
        if (p.pasS[id] && p.pasS[id] < 5) normalPool.push({ id, type: 'pas' });
        else if (!p.pasS[id] && Object.keys(p.pasS).length < 6) normalPool.push({ id, type: 'pas' });
    });
    // メイン武器の強化
    if (p.mainW && p.mainW.lv < 5) normalPool.push({ id: p.mainW.id, type: 'main' });

    // 3. 画面表示の構築
    if (!p.mainW) {
        title.innerText = "メイン武器を選択せよ";
        Object.keys(DB.main).forEach(id => addCard(id, 'main', false));
    } else {
        title.innerText = "スキルアップグレード";
        // 進化を優先しつつランダムに3枚選出
        let finalChoices = [...evoPool, ...normalPool.sort(() => 0.5 - Math.random())].slice(0, 3);
        finalChoices.forEach(item => addCard(item.id, item.type, item.isEvo));
    }
}

function addCard(id, type, isEvo) {
    const data = type === 'main' ? DB.main[id] : (type === 'sub' ? DB.sub[id] : DB.pas[id]);
    const div = document.createElement('div');
    div.className = `card ${isEvo ? 'red' : ''}`;
    
    let currentLv = type === 'main' ? (p.mainW?.lv || 0) : (type === 'sub' ? (p.atkS[id] || 0) : (p.pasS[id] || 0));
    
    div.innerHTML = `
        <div class="type-tag">${isEvo ? 'EVOLUTION' : type.toUpperCase()}</div>
        <h3>${isEvo ? data.r : data.n}</h3>
        <div class="desc">${isEvo ? "究極の力を解放せよ！" : data.d}</div>
        <div style="font-weight:bold; margin-top:5px; color:#c0392b;">${isEvo ? 'MAX' : 'Lv.'+(currentLv+1)}</div>
    `;

    div.onclick = () => {
        if (type === 'main') {
            if (!p.mainW) p.mainW = { id, lv: 1 };
            else p.mainW.lv = isEvo ? 6 : p.mainW.lv + 1;
        } else if (type === 'sub') {
            p.atkS[id] = isEvo ? 6 : (p.atkS[id] || 0) + 1;
            // ドローン特殊合体（簡易版：片方を進化させたら片方を消す）
            if (isEvo && (id === 'droneA' || id === 'droneB')) {
                delete p.atkS.droneA; delete p.atkS.droneB; p.atkS.destroyer = 6;
            }
        } else {
            p.pasS[id] = (p.pasS[id] || 0) + 1;
            if (id === 'hp') { p.max += 20; p.hp += 20; }
        }
        document.getElementById('menu').style.display = 'none';
        state = 'play';
    };
    document.getElementById('options').appendChild(div);
}

// 最終描画エンジン
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // 背景：簡易グリッド
    ctx.strokeStyle = "rgba(0,0,0,0.1)";
    for(let x=0; x<canvas.width; x+=60) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); }
    for(let y=0; y<canvas.width; y+=60) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke(); }

    // ジェム
    gems.forEach(g => { ctx.fillStyle="#2ecc71"; ctx.beginPath(); ctx.arc(g.x, g.y, 5, 0, 7); ctx.fill(); });
    
    // 弾
    bullets.forEach(b => { 
        ctx.fillStyle = b.c || "#fff"; 
        ctx.beginPath(); ctx.arc(b.x, b.y, b.s || 5, 0, 7); ctx.fill(); 
    });

    // 敵
    enemies.forEach(e => {
        ctx.fillStyle = "#333"; ctx.fillRect(e.x-e.size, e.y-e.size, e.size*2, e.size*2);
        // HPバー
        const barW = 30;
        ctx.fillStyle = "#555"; ctx.fillRect(e.x - barW/2, e.y + 22, barW, 4);
        ctx.fillStyle = "#ff4757"; 
        ctx.fillRect(e.x - barW/2, e.y + 22, barW * (e.hp / e.maxHp), 4);
    });

    // プレイヤー
    ctx.fillStyle = "#00a8ff"; ctx.fillRect(p.x-15, p.y-15, 30, 30);
    // HPバー
    ctx.fillStyle = "#333"; ctx.fillRect(p.x-20, p.y+22, 40, 6);
    ctx.fillStyle = "#2ed573"; ctx.fillRect(p.x-20, p.y+22, (p.hp/p.max)*40, 6);

    // UI更新
    document.getElementById('exp-fill').style.width = (p.exp / p.next * 100) + "%";
    document.getElementById('lv-txt').innerText = `Lv.${p.lv}`;
    document.getElementById('kill-txt').innerText = `KILLS: ${kills}`;
}

// 起動
function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

openSkillMenu();
loop();
</script>
