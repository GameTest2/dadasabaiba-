<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ダダサバイバー完全移植版・極</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: 'Arial Black', sans-serif; user-select: none; }
        canvas { display: block; background: #3d5e35; }
        /* GUI: 上部経験値バー */
        #ui { position: absolute; top: 0; left: 0; width: 100%; pointer-events: none; z-index: 100; }
        #exp-container { width: 100%; height: 20px; background: #333; border-bottom: 3px solid #000; }
        #exp-fill { width: 0%; height: 100%; background: #00a8ff; box-shadow: inset 0 -4px rgba(0,0,0,0.3); transition: width 0.1s; }
        #stats { display: flex; justify-content: space-between; color: white; padding: 10px 20px; text-shadow: 2px 2px #000; font-size: 22px; }
        
        /* スキル選択オーバーレイ */
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 200; pointer-events: auto; }
        .card-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; max-width: 1000px; }
        
        /* カードデザイン */
        .card { 
            background: linear-gradient(180deg, #f1c40f, #d4ac0d); border-radius: 15px; padding: 15px; width: 220px; 
            text-align: center; cursor: pointer; border: 5px solid #000; border-bottom-width: 12px; 
            transition: transform 0.1s; color: #222; 
        }
        .card:hover { transform: scale(1.05); }
        .card.red { background: linear-gradient(180deg, #ff4757, #ff6b81); color: white; border-color: #fff; animation: glow 0.8s infinite alternate; }
        .card.gold { background: linear-gradient(180deg, #fff200, #ff9f43); border-color: #fff; font-weight: bold; }
        @keyframes glow { from { box-shadow: 0 0 10px #ff4757; } to { box-shadow: 0 0 30px #ff6b81; } }
        
        h2 { color: #f1c40f; font-size: 42px; margin-bottom: 30px; text-shadow: 4px 4px #000; }
        .type-tag { font-size: 12px; background: rgba(0,0,0,0.2); padding: 2px 8px; border-radius: 10px; font-weight: bold; }
        .desc { font-size: 13px; margin-top: 10px; font-weight: bold; background: rgba(255,255,255,0.2); padding: 8px; border-radius: 6px; min-height: 40px; }
    </style>
</head>
<body>
    <div id="ui">
        <div id="exp-container"><div id="exp-fill"></div></div>
        <div id="stats"><div id="lv-txt">Lv.1</div><div id="kill-txt">KILLS: 0</div></div>
    </div>
    <div id="menu" class="overlay"><h2 id="menu-title">メイン武器を選択</h2><div id="options" class="card-list"></div></div>
    <canvas id="game"></canvas>

<script>
// --- [1/4] 武器・スキル・無敵モード完全データベース ---
const DB = {
    // メイン武器 (最初に1つ選択)
    main: {
        kunai: { n: "クナイ", e: "power", r: "幽霊手裏剣", t: "track", d: "自動追尾攻撃" },
        shotgun: { n: "ショットガン", e: "bomb", r: "ガトリング", t: "fan", d: "前方への強力な射撃" },
        bat: { n: "バット", e: "hp", r: "ルシール", t: "swing", d: "広範囲ノックバック" },
        katana: { n: "カタナ", e: "armor", r: "妖刀正宗", t: "slash", d: "前後への鋭い斬撃" },
        revolver: { n: "リボルバー", e: "power", r: "死神", t: "aim", d: "高威力の精密射撃" },
        void: { n: "破壊の力", e: "exo", r: "新生の虚無", t: "blackhole", d: "敵を吸い込む重力弾" },
        light: { n: "ライトチェイサー", e: "armor", r: "不滅の灯", t: "wave", d: "巨大な剣気による広域攻撃" }
    },
    // 攻撃スキル (最大5つ)
    sub: {
        soccer: { n: "サッカーボール", e: "shoes", r: "量子ボール", t: "bounce", d: "跳ね返る高速攻撃" },
        lightning: { n: "雷発生器", e: "cube", r: "ジャッジメント", t: "thunder", d: "ランダム落雷" },
        guardian: { n: "ガーディアン", e: "exo", r: "ディフェンダー", t: "rotate", d: "回転して敵を弾く" },
        force: { n: "力場発生器", e: "drink", r: "重力場", t: "aura", d: "周囲にダメージエリア" },
        drill: { n: "ドリルショット", e: "ammo", r: "ホイッスル", t: "bounce", d: "貫通反射ドリル" },
        rocket: { n: "ロケット", e: "bomb", r: "シャークアタック", t: "rocket", d: "爆発ミサイル" },
        molotov: { n: "火炎瓶", e: "oil", r: "燃料樽", t: "fire", d: "地面を燃やす" },
        brick: { n: "レンガ", e: "hp", r: "鉄鉄球", t: "drop", d: "重量物の投下" },
        laser: { n: "レーザー", e: "diffuser", r: "死の光線", t: "laser", d: "貫通光線" },
        boomerang: { n: "ブーメラン", e: "magnet", r: "マグネットダーツ", t: "circle", d: "往復する円盤" },
        droneA: { n: "ドローンA", e: "droneB", r: "破壊者", t: "drone", s: true },
        droneB: { n: "ドローンB", e: "droneA", r: "破壊者", t: "drone", s: true }
    },
    // 補助スキル (最大6つ)
    pas: {
        power: { n: "強力銃弾", d: "攻撃力+20%" },
        hp: { n: "フィットネスG", d: "HP上限+20%" },
        drink: { n: "ドリンク", d: "HP継続回復" },
        shoes: { n: "運動靴", d: "移動速度+10%" },
        exo: { n: "外骨格腕輪", d: "持続時間+20%" },
        cube: { n: "エナジーキューブ", d: "CD短縮-10%" },
        magnet: { n: "強力マグネット", d: "回収範囲+40%" },
        bomb: { n: "高性能爆薬", d: "攻撃範囲+20%" },
        ammo: { n: "弾薬推進器", d: "弾速+20%" },
        oil: { n: "石油債券", d: "経験値+20%" },
        armor: { n: "浪人の鎧", d: "ダメージ軽減10%" },
        diffuser: { n: "ディフューザー", d: "攻撃強化" },
        god: { n: "無敵モード", d: "ダメージを一切受けない", special: true }
    }
};

// パート1終了。続きの【Part 2: 無敵フラグ対応の移動・敵管理システム】へ進みますか？
// --- [2/4] ゲームコア・無敵判定・システムセクション ---

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let state = 'menu'; // menu, play
let frame = 0, kills = 0;

// プレイヤーデータ（無敵フラグを追加）
const p = {
    x: canvas.width / 2, y: canvas.height / 2,
    lv: 1, exp: 0, next: 5, hp: 100, max: 100,
    baseSpd: 4, size: 20, baseMag: 110,
    isGod: false,       // 無敵モードフラグ
    mainW: null,        // {id, lv}
    atkS: {},           // {id: lv}
    pasS: {}            // {id: lv}
};

let bullets = [], enemies = [], gems = [];
const keys = {};

window.onkeydown = e => {
    keys[e.code] = true;
    // デバッグ用：Gキーで無敵切り替え
    if (e.code === 'KeyG') { p.isGod = !p.isGod; console.log("GodMode:" + p.isGod); }
};
window.onkeyup = e => keys[e.code] = false;

// ---------------------------------------------------------
// メイン更新ロジック
// ---------------------------------------------------------

function update() {
    if (state !== 'play') return;
    frame++;

    // 1. 移動処理（運動靴反映）
    const spdMod = 1 + (p.pasS.shoes || 0) * 0.1;
    const mx = (keys['KeyD']||keys['ArrowRight']?1:0) - (keys['KeyA']||keys['ArrowLeft']?1:0);
    const my = (keys['KeyS']||keys['ArrowDown']?1:0) - (keys['KeyW']||keys['ArrowUp']?1:0);
    if (mx !== 0 || my !== 0) {
        const a = Math.atan2(my, mx);
        p.x += Math.cos(a) * p.baseSpd * spdMod;
        p.y += Math.sin(a) * p.baseSpd * spdMod;
    }

    // 2. 敵生成（レベルに応じてスポーン間隔を調整）
    if (frame % Math.max(5, 25 - p.lv) === 0 && enemies.length < 120) {
        const ang = Math.random() * 6.28;
        enemies.push({
            x: p.x + Math.cos(ang) * 800,
            y: p.y + Math.sin(ang) * 800,
            hp: 6 + (p.lv * 5), maxHp: 6 + (p.lv * 5),
            spd: 2.2 + (p.lv * 0.04), size: 18
        });
    }

    // 3. 敵AI・プレイヤー衝突判定（★無敵モードの適用）
    const defMod = 1 - (p.pasS.armor || 0) * 0.1;
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        const d = Math.hypot(p.x - e.x, p.y - e.y);
        e.x += (p.x - e.x) / d * e.spd;
        e.y += (p.y - e.y) / d * e.spd;

        if (d < p.size + e.size) {
            if (!p.isGod) { // ★無敵でなければダメージ
                p.hp -= 0.5 * defMod;
                if (p.hp <= 0) location.reload();
            }
        }
    }

    // 4. ジェム回収
    const magRange = p.baseMag * (1 + (p.pasS.magnet || 0) * 0.5);
    const expMod = 1 + (p.pasS.oil || 0) * 0.2;
    for (let i = gems.length - 1; i >= 0; i--) {
        const g = gems[i];
        const d = Math.hypot(p.x - g.x, p.y - g.y);
        if (d < magRange) {
            g.x += (p.x - g.x) * 0.25;
            g.y += (p.y - g.y) * 0.25;
        }
        if (d < 20) {
            gems.splice(i, 1);
            p.exp += 1 * expMod;
            if (p.exp >= p.next) { p.exp = 0; p.next += 10; p.lv++; openSkillMenu(); }
        }
    }

    // 5. リジェネ
    if (p.pasS.drink && frame % 300 === 0) p.hp = Math.min(p.max, p.hp + p.pasS.drink * 2);

    processWeapons(); // Part 3で定義
}

function getTarget() {
    if (!enemies.length) return null;
    return enemies.reduce((prev, curr) => 
        Math.hypot(p.x - prev.x, p.y - prev.y) < Math.hypot(p.x - curr.x, p.y - curr.y) ? prev : curr
    );
}

// パート2終了。次は全武器の物理挙動を実装する【Part 3: 固有攻撃ロジック完全実装】です。
// --- [3/4] 武器・スキル固有攻撃ロジックセクション ---

function processWeapons() {
    // 1. メイン武器の実行
    if (p.mainW) {
        runBehavior(p.mainW.id, p.mainW.lv, true);
    }
    // 2. 攻撃スキルの実行
    Object.keys(p.atkS).forEach(id => {
        runBehavior(id, p.atkS[id], false);
    });
    // 3. 弾の移動と確実なヒット判定
    updateProjectiles();
}

function runBehavior(id, lv, isMain) {
    const data = isMain ? DB.main[id] : DB.sub[id];
    const isRed = lv >= 6;
    const cdMod = Math.max(5, (isRed ? 15 : 45) - (p.pasS.cube || 0) * 5);
    const dmg = (isRed ? 15 : 5) * (1 + (p.pasS.power || 0) * 0.2); // ダメージ底上げ
    const sz = 1 + (p.pasS.bomb || 0) * 0.25;

    if (frame % cdMod === 0) {
        const target = getTarget();
        switch(data.t) {
            case "track": // クナイ・手裏剣
                if (target) {
                    const a = Math.atan2(target.y - p.y, target.x - p.x);
                    spawnB(p.x, p.y, Math.cos(a)*18, Math.sin(a)*18, { dmg, c: isRed?"#fff":"#ff0", s: 6*sz });
                }
                break;
            case "fan": // ショットガン
                const bA = target ? Math.atan2(target.y - p.y, target.x - p.x) : 0;
                const c = isRed ? 1 : 5;
                for(let i=0; i<c; i++){
                    const a = isRed ? bA : bA + (i-2)*0.2;
                    spawnB(p.x, p.y, Math.cos(a)*20, Math.sin(a)*20, { dmg, c: "#fff", s: 5*sz, life: isRed?120:40 });
                }
                break;
            case "bounce": // ドリル・サッカー
                const ang = Math.random() * 6.28;
                spawnB(p.x, p.y, Math.cos(ang)*12, Math.sin(ang)*12, { dmg, b: isRed?99:5, trk: (id==='drill'&&isRed), c: isRed?"#f0f":"#0ff", s: 10*sz });
                break;
            case "drop": // レンガ
                if (isRed) { for(let i=0; i<8; i++) spawnB(p.x, p.y, Math.cos(i*0.8)*12, Math.sin(i*0.8)*12, { dmg, prc: true, c: "#888", s: 28*sz }); }
                else { spawnB(p.x, p.y, (Math.random()-0.5)*12, -18, { g: 0.8, dmg, c: "#a52a2a", s: 18*sz }); }
                break;
            case "blackhole": // 破壊の力
                if (target) {
                    const a = Math.atan2(target.y - p.y, target.x - p.x);
                    spawnB(p.x, p.y, Math.cos(a)*6, Math.sin(a)*6, { dmg, life: 120, bl: isRed?200:130, c: "#000", s: 15*sz, pull: true });
                }
                break;
            case "rocket": // ロケット
                if (target) {
                    const a = Math.atan2(target.y - p.y, target.x - p.x);
                    spawnB(p.x, p.y, Math.cos(a)*8, Math.sin(a)*8, { dmg, bl: isRed?200:110, c: isRed?"#f33":"#fb0", s: 22*sz });
                }
                break;
            case "thunder": // 雷
                if (target) spawnB(target.x, target.y - 400, 0, 30, { dmg: 25, life: 15, c: "#ff0", s: 15*sz });
                break;
            case "fire": // 火炎瓶
                const tx = p.x + (Math.random()-0.5)*500, ty = p.y + (Math.random()-0.5)*500;
                spawnB(tx, ty, 0, 0, { dmg: 0.3, life: 160, c: isRed?"#0af":"#f50", s: (isRed?130:80)*sz, area: true });
                break;
        }
    }

    if (data.t === "rotate") { // ガーディアン
        const cnt = isRed ? 6 : 2 + Math.floor(lv/2);
        for(let i=0; i<cnt; i++) {
            const ang = (frame*0.09) + (i*6.28/cnt), d = isRed ? 140 : 100;
            spawnB(p.x+Math.cos(ang)*d, p.y+Math.sin(ang)*d, 0, 0, { dmg: 0.8, life: 1, c: "#ccc", s: (isRed?35:22)*sz, area: true });
        }
    }
}

function spawnB(x, y, vx, vy, o) {
    const spdM = 1 + (p.pasS.ammo || 0) * 0.2;
    bullets.push({ x, y, vx: vx*spdM, vy: vy*spdM, ...o, life: o.life || 300 });
}

function updateProjectiles() {
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        if (b.g) b.vy += b.g;
        if (b.trk && enemies.length) {
            const e = getTarget();
            const a = Math.atan2(e.y - b.y, e.x - b.x);
            b.vx = Math.cos(a)*17; b.vy = Math.sin(a)*17;
        }
        b.x += b.vx; b.y += b.vy;
        if (b.b && (b.x<0 || b.x>canvas.width || b.y<0 || b.y>canvas.height)) { b.vx *= -1; b.vy *= -1; b.b--; }
        
        // 当たり判定の修正：確実にヒットさせる
        for (let ei = enemies.length - 1; ei >= 0; ei--) {
            const e = enemies[ei];
            if (Math.hypot(e.x - b.x, e.y - b.y) < e.size + (b.s || 5)) {
                e.hp -= b.dmg;
                if (b.bl) { // 爆発
                    ctx.fillStyle = "rgba(255,100,0,0.5)"; ctx.beginPath(); ctx.arc(b.x, b.y, b.bl, 0, 7); ctx.fill();
                    enemies.forEach(ne => { if(Math.hypot(b.x-ne.x, b.y-ne.y) < b.bl) ne.hp -= b.dmg; });
                    bullets.splice(i, 1); break;
                } else if (!b.prc && !b.area && !b.pull) {
                    bullets.splice(i, 1); break; 
                }
            }
        }
        
        // 敵の死亡判定
        for (let ei = enemies.length - 1; ei >= 0; ei--) {
            if (enemies[ei].hp <= 0) { gems.push({x: enemies[ei].x, y: enemies[ei].y}); enemies.splice(ei, 1); kills++; }
        }

        if (bullets[i] && --bullets[i].life <= 0) bullets.splice(i, 1);
    }
}
// --- [4/4] 進化判定・描画・メインシステム完結セクション ---

function openSkillMenu() {
    state = 'menu';
    const menu = document.getElementById('menu');
    const container = document.getElementById('options');
    const title = document.getElementById('menu-title');
    
    menu.style.display = 'flex';
    container.innerHTML = '';

    // 1. 進化（Red）候補の抽出
    let evoPool = [];
    if (p.mainW && p.mainW.lv === 5 && p.pasS[DB.main[p.mainW.id].e]) {
        evoPool.push({ id: p.mainW.id, type: 'main', isEvo: true });
    }
    Object.keys(p.atkS).forEach(id => {
        if (p.atkS[id] === 5 && p.pasS[DB.sub[id].e]) evoPool.push({ id, type: 'sub', isEvo: true });
    });

    // 2. 通常スキル候補（枠制限：攻撃5、補助6）
    let normalPool = [];
    Object.keys(DB.sub).forEach(id => {
        if (p.atkS[id] && p.atkS[id] < 5) normalPool.push({ id, type: 'sub' });
        else if (!p.atkS[id] && Object.keys(p.atkS).length < 5) normalPool.push({ id, type: 'sub' });
    });
    Object.keys(DB.pas).forEach(id => {
        if (id === 'god') { normalPool.push({ id, type: 'pas' }); return; } // 無敵は常に候補
        if (p.pasS[id] && p.pasS[id] < 5) normalPool.push({ id, type: 'pas' });
        else if (!p.pasS[id] && Object.keys(p.pasS).length < 6) normalPool.push({ id, type: 'pas' });
    });
    if (p.mainW && p.mainW.lv < 5) normalPool.push({ id: p.mainW.id, type: 'main' });

    // 3. 画面構築
    if (!p.mainW) {
        title.innerText = "メイン武器を選択せよ";
        Object.keys(DB.main).forEach(id => addCard(id, 'main', false));
    } else {
        title.innerText = "スキルアップグレード";
        let choices = [...evoPool, ...normalPool.sort(() => 0.5 - Math.random())].slice(0, 3);
        choices.forEach(item => addCard(item.id, item.type, item.isEvo));
    }
}

function addCard(id, type, isEvo) {
    const data = type === 'main' ? DB.main[id] : (type === 'sub' ? DB.sub[id] : DB.pas[id]);
    const div = document.createElement('div');
    const isGod = id === 'god';
    div.className = `card ${isEvo ? 'red' : (isGod ? 'gold' : '')}`;
    
    let lv = type === 'main' ? (p.mainW?.lv || 0) : (type === 'sub' ? (p.atkS[id] || 0) : (p.pasS[id] || 0));
    
    div.innerHTML = `
        <div class="type-tag">${isEvo ? 'EVO' : type.toUpperCase()}</div>
        <h3>${isEvo ? data.r : data.n}</h3>
        <div class="desc">${isEvo ? "究極進化！" : data.d}</div>
        <div style="font-weight:bold; margin-top:5px;">${isEvo ? 'MAX' : 'Lv.'+(lv+1)}</div>
    `;

    div.onclick = () => {
        if (id === 'god') { p.isGod = true; }
        else if (type === 'main') {
            if (!p.mainW) p.mainW = { id, lv: 1 };
            else p.mainW.lv = isEvo ? 6 : p.mainW.lv + 1;
        } else if (type === 'sub') {
            p.atkS[id] = isEvo ? 6 : (p.atkS[id] || 0) + 1;
        } else {
            p.pasS[id] = (p.pasS[id] || 0) + 1;
            if (id === 'hp') { p.max += 20; p.hp += 20; }
        }
        document.getElementById('menu').style.display = 'none';
        state = 'play';
    };
    document.getElementById('options').appendChild(div);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // 背景グリッド
    ctx.strokeStyle = "rgba(0,0,0,0.1)";
    for(let x=0; x<canvas.width; x+=60) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); }
    for(let y=0; y<canvas.height; y+=60) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke(); }

    gems.forEach(g => { ctx.fillStyle="#2ecc71"; ctx.beginPath(); ctx.arc(g.x, g.y, 5, 0, 7); ctx.fill(); });
    bullets.forEach(b => { ctx.fillStyle=b.c; ctx.beginPath(); ctx.arc(b.x, b.y, b.s, 0, 7); ctx.fill(); });
    enemies.forEach(e => {
        ctx.fillStyle = "#333"; ctx.fillRect(e.x-e.size, e.y-e.size, e.size*2, e.size*2);
        ctx.fillStyle = "#555"; ctx.fillRect(e.x-15, e.y+22, 30, 4);
        ctx.fillStyle = "#ff4757"; ctx.fillRect(e.x-15, e.y+22, 30*(e.hp/e.maxHp), 4);
    });

    // プレイヤー描画（無敵時は黄金に光る）
    if (p.isGod) {
        ctx.fillStyle = frame % 6 < 3 ? "#fff200" : "#fff";
        ctx.shadowBlur = 20; ctx.shadowColor = "#fff200";
    } else {
        ctx.fillStyle = "#00a8ff"; ctx.shadowBlur = 0;
    }
    ctx.fillRect(p.x-15, p.y-15, 30, 30);
    ctx.shadowBlur = 0;

    ctx.fillStyle = "#333"; ctx.fillRect(p.x-20, p.y+22, 40, 6);
    ctx.fillStyle = "#2ed573"; ctx.fillRect(p.x-20, p.y+22, (p.hp/p.max)*40, 6);

    document.getElementById('exp-fill').style.width = (p.exp/p.next*100) + "%";
    document.getElementById('lv-txt').innerText = `Lv.${p.lv} ${p.isGod ? ' [GOD]' : ''}`;
    document.getElementById('kill-txt').innerText = `KILLS: ${kills}`;
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

openSkillMenu();
loop();
</script>
</body>
</html>
