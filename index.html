<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ミニ・サバイバー</title>
    <style>
        body { margin: 0; overflow: hidden; background: #222; font-family: sans-serif; }
        canvas { display: block; background: #34495e; margin: 0 auto; }
        #ui { position: absolute; top: 10px; left: 10px; color: white; pointer-events: none; }
        .bar-bg { width: 200px; height: 10px; background: #555; border-radius: 5px; }
        .bar-fill { height: 100%; width: 100%; border-radius: 5px; transition: width 0.1s; }
        #hp-bar { background: #e74c3c; }
        #exp-bar { background: #f1c40f; width: 0%; }
        #msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: gold; font-size: 40px; display: none; }
    </style>
</head>
<body>
    <div id="ui">
        HP: <div class="bar-bg"><div id="hp-bar" class="bar-fill"></div></div>
        EXP: <div class="bar-bg"><div id="exp-bar" class="bar-fill"></div></div>
        <div id="score">撃破数: 0</div>
    </div>
    <div id="msg">LEVEL UP!</div>
    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const hpBar = document.getElementById('hp-bar');
const expBar = document.getElementById('exp-bar');
const scoreEl = document.getElementById('score');
const msg = document.getElementById('msg');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// ゲーム状態
const player = { x: canvas.width/2, y: canvas.height/2, size: 20, speed: 4, hp: 100, maxHp: 100, exp: 0, nextExp: 5 };
let enemies = [];
let bullets = [];
let particles = [];
let score = 0;
let level = 1;
const keys = {};

// 入力検知
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

// 敵生成
function spawnEnemy() {
    const side = Math.floor(Math.random() * 4);
    let x, y;
    if (side === 0) { x = Math.random() * canvas.width; y = -30; }
    else if (side === 1) { x = Math.random() * canvas.width; y = canvas.height + 30; }
    else if (side === 2) { x = -30; y = Math.random() * canvas.height; }
    else { x = canvas.width + 30; y = Math.random() * canvas.height; }
    enemies.push({ x, y, size: 15, hp: 2 + Math.floor(level/2), speed: 1.5 + (level * 0.1) });
}

// 自動攻撃（一番近い敵を狙う）
setInterval(() => {
    if (enemies.length === 0) return;
    let target = enemies[0];
    let minDist = Infinity;
    enemies.forEach(e => {
        const d = Math.hypot(e.x - player.x, e.y - player.y);
        if (d < minDist) { minDist = d; target = e; }
    });
    const angle = Math.atan2(target.y - player.y, target.x - player.x);
    bullets.push({ x: player.x, y: player.y, vx: Math.cos(angle) * 8, vy: Math.sin(angle) * 8, size: 5 });
}, 500);

function update() {
    // プレイヤー移動
    if (keys['ArrowUp'] || keys['KeyW']) player.y -= player.speed;
    if (keys['ArrowDown'] || keys['KeyS']) player.y += player.speed;
    if (keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed;
    if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed;

    // 弾の移動
    bullets.forEach((b, i) => {
        b.x += b.vx; b.y += b.vy;
        if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) bullets.splice(i, 1);
    });

    // 敵の移動と衝突
    enemies.forEach((e, i) => {
        const angle = Math.atan2(player.y - e.y, player.x - e.x);
        e.x += Math.cos(angle) * e.speed;
        e.y += Math.sin(angle) * e.speed;

        // プレイヤーとの衝突
        if (Math.hypot(e.x - player.x, e.y - player.y) < player.size) {
            player.hp -= 0.5;
            hpBar.style.width = `${(player.hp / player.maxHp) * 100}%`;
            if (player.hp <= 0) location.reload();
        }

        // 弾との衝突
        bullets.forEach((b, bi) => {
            if (Math.hypot(e.x - b.x, e.y - b.y) < e.size) {
                e.hp--;
                bullets.splice(bi, 1);
                if (e.hp <= 0) {
                    enemies.splice(i, 1);
                    score++;
                    player.exp++;
                    scoreEl.innerText = `撃破数: ${score}`;
                    updateExp();
                }
            }
        });
    });

    if (Math.random() < 0.05 + (level * 0.01)) spawnEnemy();
}

function updateExp() {
    if (player.exp >= player.nextExp) {
        level++;
        player.exp = 0;
        player.nextExp += 5;
        player.hp = player.maxHp;
        msg.style.display = 'block';
        setTimeout(() => msg.style.display = 'none', 1000);
    }
    expBar.style.width = `${(player.exp / player.nextExp) * 100}%`;
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // プレイヤー
    ctx.fillStyle = '#3498db';
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.size, 0, Math.PI*2);
    ctx.fill();

    // 敵
    ctx.fillStyle = '#e67e22';
    enemies.forEach(e => {
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.size, 0, Math.PI*2);
        ctx.fill();
    });

    // 弾
    ctx.fillStyle = '#f1c40f';
    bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.size, 0, Math.PI*2);
        ctx.fill();
    });

    requestAnimationFrame(() => {
        update();
        draw();
    });
}

draw();
</script>
</body>
</html>
