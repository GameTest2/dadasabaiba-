<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ダダサバイバー風JS</title>
    <style>
        body { margin: 0; overflow: hidden; background: #222; font-family: 'Arial', sans-serif; user-select: none; }
        canvas { display: block; background: #4a7c44; margin: 0 auto; cursor: crosshair; }
        #ui { position: absolute; top: 10px; left: 10px; color: white; width: 250px; text-shadow: 2px 2px 2px #000; }
        .bar-bg { width: 100%; height: 12px; background: #333; border: 2px solid #000; margin-bottom: 5px; }
        #hp-bar { height: 100%; width: 100%; background: #ff4757; transition: width 0.2s; }
        #exp-bar { height: 100%; width: 0%; background: #2ed573; transition: width 0.2s; }
        #level-text { font-weight: bold; color: #eccc68; margin-bottom: 5px; }
        
        /* スキル選択画面 */
        #skill-menu { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85); padding: 20px; border-radius: 15px;
            display: none; text-align: center; border: 3px solid #eccc68; z-index: 100;
        }
        .skill-option {
            background: #444; color: white; padding: 15px; margin: 10px; border-radius: 8px;
            cursor: pointer; border: 2px solid #666; transition: 0.2s;
        }
        .skill-option:hover { background: #666; border-color: #fff; }
        h2 { color: #eccc68; margin-top: 0; }
    </style>
</head>
<body>

<div id="ui">
    <div id="level-text">Lv.1 サバイバー</div>
    HP: <div class="bar-bg"><div id="hp-bar"></div></div>
    EXP: <div class="bar-bg"><div id="exp-bar"></div></div>
    <div id="score">KILLS: 0</div>
</div>

<div id="skill-menu">
    <h2>スキルアップグレード！</h2>
    <div id="options-container"></div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const hpBar = document.getElementById('hp-bar');
const expBar = document.getElementById('exp-bar');
const scoreEl = document.getElementById('score');
const levelEl = document.getElementById('level-text');
const skillMenu = document.getElementById('skill-menu');
const optionsContainer = document.getElementById('options-container');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let isPaused = false;
let score = 0;
let level = 1;

// プレイヤー設定
const player = {
    x: canvas.width/2, y: canvas.height/2, size: 25, speed: 3.5,
    hp: 100, maxHp: 100, exp: 0, nextExp: 5,
    weapon: 'shotgun', bulletCount: 3, fireRate: 800, lastFire: 0, power: 1
};

let enemies = [];
let bullets = [];
const keys = {};

// テクスチャ描画関数（本家風の色使い）
function drawPlayer(x, y) {
    ctx.fillStyle = '#feca57'; // 体
    ctx.fillRect(x - 12, y - 12, 24, 24);
    ctx.fillStyle = '#222f3e'; // 目
    ctx.fillRect(x - 8, y - 5, 4, 4);
    ctx.fillRect(x + 4, y - 5, 4, 4);
    ctx.fillStyle = '#ff6b6b'; // バンダナ
    ctx.fillRect(x - 14, y - 15, 28, 6);
}

function drawEnemy(x, y) {
    ctx.fillStyle = '#576574'; // モンスター
    ctx.beginPath();
    ctx.moveTo(x, y - 15); ctx.lineTo(x + 15, y + 15); ctx.lineTo(x - 15, y + 15);
    ctx.fill();
    ctx.fillStyle = '#ff9f43'; // 目
    ctx.fillRect(x - 4, y, 8, 3);
}

window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

// ショットガン攻撃
function fireShotgun() {
    if (isPaused) return;
    const now = Date.now();
    if (now - player.lastFire < player.fireRate) return;

    let target = null;
    let minDist = 500;
    enemies.forEach(e => {
        const d = Math.hypot(e.x - player.x, e.y - player.y);
        if (d < minDist) { minDist = d; target = e; }
    });

    if (target) {
        const baseAngle = Math.atan2(target.y - player.y, target.x - player.x);
        const spread = 0.3; // 扇状の広がり
        for (let i = 0; i < player.bulletCount; i++) {
            const angle = baseAngle + (i - (player.bulletCount - 1) / 2) * spread;
            bullets.push({
                x: player.x, y: player.y,
                vx: Math.cos(angle) * 10, vy: Math.sin(angle) * 10,
                damage: player.power
            });
        }
        player.lastFire = now;
    }
}

// スキル選択
const skills = [
    { name: "弾数アップ", action: () => player.bulletCount++ },
    { name: "攻撃速度アップ", action: () => player.fireRate *= 0.8 },
    { name: "移動速度アップ", action: () => player.speed += 0.5 },
    { name: "最大HPアップ", action: () => { player.maxHp += 20; player.hp = player.maxHp; } },
    { name: "攻撃力アップ", action: () => player.power += 1 }
];

function showSkillMenu() {
    isPaused = true;
    skillMenu.style.display = 'block';
    optionsContainer.innerHTML = '';
    
    // ランダムに3つ選出
    const shuffled = [...skills].sort(() => 0.5 - Math.random()).slice(0, 3);
    shuffled.forEach(s => {
        const btn = document.createElement('div');
        btn.className = 'skill-option';
        btn.innerText = s.name;
        btn.onclick = () => {
            s.action();
            isPaused = false;
            skillMenu.style.display = 'none';
        };
        optionsContainer.appendChild(btn);
    });
}

function update() {
    if (isPaused) return;

    if (keys['ArrowUp'] || keys['KeyW']) player.y -= player.speed;
    if (keys['ArrowDown'] || keys['KeyS']) player.y += player.speed;
    if (keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed;
    if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed;

    fireShotgun();

    bullets.forEach((b, i) => {
        b.x += b.vx; b.y += b.vy;
        if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) bullets.splice(i, 1);
    });

    enemies.forEach((e, i) => {
        const angle = Math.atan2(player.y - e.y, player.x - e.x);
        e.x += Math.cos(angle) * e.speed;
        e.y += Math.sin(angle) * e.speed;

        if (Math.hypot(e.x - player.x, e.y - player.y) < player.size) {
            player.hp -= 0.5;
            hpBar.style.width = `${(player.hp / player.maxHp) * 100}%`;
            if (player.hp <= 0) location.reload();
        }

        bullets.forEach((b, bi) => {
            if (Math.hypot(e.x - b.x, e.y - b.y) < 20) {
                e.hp -= b.damage;
                bullets.splice(bi, 1);
                if (e.hp <= 0) {
                    enemies.splice(i, 1);
                    score++;
                    player.exp++;
                    scoreEl.innerText = `KILLS: ${score}`;
                    if (player.exp >= player.nextExp) {
                        level++;
                        levelEl.innerText = `Lv.${level} サバイバー`;
                        player.exp = 0;
                        player.nextExp += 5;
                        showSkillMenu();
                    }
                    expBar.style.width = `${(player.exp / player.nextExp) * 100}%`;
                }
            }
        });
    });

    if (Math.random() < 0.03 + (level * 0.01)) {
        const side = Math.floor(Math.random() * 4);
        let x, y;
        if (side === 0) { x = Math.random() * canvas.width; y = -50; }
        else if (side === 1) { x = Math.random() * canvas.width; y = canvas.height + 50; }
        else if (side === 2) { x = -50; y = Math.random() * canvas.height; }
        else { x = canvas.width + 50; y = Math.random() * canvas.height; }
        enemies.push({ x, y, hp: 2 + level, speed: 1.2 + (level * 0.1) });
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // グリッド背景（本家風）
    ctx.strokeStyle = '#3d6638';
    ctx.lineWidth = 1;
    for(let i=0; i<canvas.width; i+=50) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
    for(let j=0; j<canvas.height; j+=50) { ctx.beginPath(); ctx.moveTo(0,j); ctx.lineTo(canvas.width,j); ctx.stroke(); }

    enemies.forEach(e => drawEnemy(e.x, e.y));
    
    ctx.fillStyle = '#fff200';
    bullets.forEach(b => {
        ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI*2); ctx.fill();
    });

    drawPlayer(player.x, player.y);

    requestAnimationFrame(() => {
        update();
        draw();
    });
}

draw();
</script>
</body>
</html>
